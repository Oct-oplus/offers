<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واجهة المنسقة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--panel:#0F1A2B;--cardA:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.02);--stroke:rgba(255,255,255,.12);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.70);--blue:#2DD4FF;--blue2:#4F8BFF;--green:#22C55E;--amber:#FBBF24;--fill:rgba(255,255,255,.06);--shadow:0 18px 55px rgba(0,0,0,.45);--navbg:rgba(15,26,43,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F3F6FB;--panel:#FFFFFF;--cardA:rgba(0,0,0,.04);--cardB:rgba(0,0,0,.02);--stroke:rgba(0,0,0,.10);--text:rgba(10,16,24,.92);--muted:rgba(10,16,24,.65);--fill:rgba(0,0,0,.04);--shadow:0 18px 55px rgba(0,0,0,.16);--navbg:rgba(255,255,255,.94);--amber:#D97706}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 600px at 85% -10%,rgba(45,212,255,.22),transparent 55%),radial-gradient(700px 500px at 5% 0%,rgba(34,197,94,.16),transparent 60%),var(--bg);background-color:var(--bg);line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:12px 14px 100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top b{font-size:20px}
.chip,.toggle{border:1px solid var(--stroke);background:var(--fill);border-radius:999px;padding:8px 12px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:99px;background:linear-gradient(180deg,var(--blue),var(--green))}
.dot.off{background:var(--muted);opacity:.5}
h2{font-size:18px;margin:22px 0 10px}
.hero{border:1px solid var(--stroke);background:linear-gradient(135deg,rgba(79,139,255,.16),rgba(34,197,94,.10));border-radius:22px;padding:18px}
.hero h1{margin:0 0 4px;font-size:24px}
.hero p{margin:0;color:var(--muted)}
.carousel{margin:0 -14px;overflow-x:auto;padding:4px 0;scrollbar-width:none;cursor:grab}
.carousel::-webkit-scrollbar{display:none}
.carousel.drag{cursor:grabbing;user-select:none}
.track{display:flex;width:max-content}
.track .card{width:265px;margin-inline-end:12px;flex:none}
.card{position:relative;overflow:hidden;border:1px solid var(--stroke);border-radius:18px;padding:14px;background:linear-gradient(180deg,var(--cardA),var(--cardB));margin-bottom:12px;cursor:pointer}
.card:hover{border-color:rgba(45,212,255,.55)}
.glow{position:absolute;inset:-70px -70px auto auto;width:180px;height:180px;background:radial-gradient(circle at 30% 30%,rgba(45,212,255,.25),transparent 60%),radial-gradient(circle at 70% 60%,rgba(34,197,94,.18),transparent 62%);pointer-events:none}
.card>*{position:relative}
.tag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--stroke);background:var(--fill);color:var(--muted)}
.card h3{margin:8px 0 2px;font-size:17px}
.desc{margin:0 0 8px;color:var(--muted);font-size:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--stroke);background:var(--fill)}
.price{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12);font-weight:700}
.star{color:var(--amber);font-size:13px}
.ok{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:16px;padding:14px;text-align:right}
.cat span{font-size:22px;display:block}
.cat small{color:var(--muted)}
.btn{border:1px solid var(--stroke);background:var(--fill);border-radius:12px;padding:11px 14px;font-size:14px;text-decoration:none;color:var(--text);display:inline-flex;justify-content:center;align-items:center;gap:6px}
.btn.primary{border-color:rgba(45,212,255,.7);background:rgba(45,212,255,.14)}
.btn.block{width:100%}
.panel{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:18px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel p{margin:0 0 8px;color:var(--muted);font-size:14px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin:8px 0;color:var(--muted);font-size:14px}
.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:rgba(45,212,255,.15);color:var(--blue);font-weight:700;font-size:13px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.seg button{flex:none;border:1px solid var(--stroke);background:var(--fill);border-radius:99px;padding:8px 14px;font-size:14px}
.seg button.on{border-color:rgba(45,212,255,.7);background:rgba(45,212,255,.14);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
.note{border:1px solid rgba(251,191,36,.55);background:rgba(251,191,36,.10);border-radius:14px;padding:12px;margin:8px 0}
.note.done{border-color:var(--stroke);background:var(--fill);opacity:.8}
.note b{font-size:13px;color:var(--amber)}
.note.done b{color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{width:46px;height:26px;border-radius:99px;border:1px solid var(--stroke);background:var(--fill);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:99px;background:var(--muted);transition:.2s}
.sw[aria-checked=true]{background:rgba(34,197,94,.3)}
.sw[aria-checked=true]:after{inset-inline-start:22px;background:var(--green)}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--navbg);border-top:1px solid var(--stroke);backdrop-filter:blur(12px);z-index:5}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--muted);position:relative}
.nav button span{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--blue);font-weight:700}
.badge{position:absolute;top:4px;inset-inline-start:50%;margin-inline-start:6px;background:#EF4444;color:#fff;font-size:10px;border-radius:99px;min-width:16px;height:16px;line-height:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.ov.show{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;max-height:88%;overflow-y:auto;background:var(--panel);border:1px solid var(--stroke);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--stroke);margin:0 auto 10px}
.rev{border-top:1px solid var(--stroke);padding:10px 0;font-size:14px}
.rev small{color:var(--muted)}
.stars button{border:0;background:none;font-size:28px;color:var(--muted);padding:0 2px}
.stars button.on{color:var(--amber)}
textarea{width:100%;font:inherit;color:var(--text);background:var(--fill);border:1px solid var(--stroke);border-radius:12px;padding:10px;min-height:70px;margin:6px 0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;display:none}
.co{display:flex;align-items:center;gap:12px}
.co .fl{font-size:28px}
.co>div{flex:1}
.co small{color:var(--muted)}
.hl{border-color:rgba(45,212,255,.8)}
.in{width:100%;font:inherit;color:var(--text);background:var(--fill);border:1px solid var(--stroke);border-radius:12px;padding:10px;margin:6px 0}
select.in option{color:#000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--blue)}.stat small{color:var(--muted);font-size:12px}
.lbl{font-size:13px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.sm{padding:8px 12px;font-size:13px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{color:var(--green)!important}.dn{color:#EF4444!important}
.pill.warn{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.12)}
.dis{opacity:.5}
.sub-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.sub-filters button{flex:none;border:1px solid var(--stroke);background:var(--fill);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--muted);cursor:pointer}
.sub-filters button.on{border-color:rgba(45,212,255,.8);background:rgba(45,212,255,.16);color:var(--text);font-weight:700}
.sub-filters button.sub-active{border-color:rgba(34,197,94,.8);background:rgba(34,197,94,.16);color:var(--green);font-weight:700}
.plist{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto;margin:6px 0}
.po{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:right;border:1px solid var(--stroke);background:var(--fill);border-radius:12px;padding:10px 12px;font-size:14px}
.po small{color:var(--muted);font-size:12px;flex:none}
.po.on{border-color:rgba(45,212,255,.8);background:rgba(45,212,255,.14)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <b>واجهة المنسقة</b>
    <div class="row" style="gap:6px;flex-wrap:wrap;justify-content:flex-end">
      <a class="chip" href="index.html" style="text-decoration:none" title="الرجوع للرئيسية"><span class="dot"></span><span>سارة (@sa_coord)</span> <span style="font-size:11px;opacity:.7">خروج ↵</span></a>
      <button class="toggle" data-act="theme" aria-label="تبديل الوضع"><span class="dot"></span><span id="thl">دارك</span></button>
    </div>
  </div>
  <main id="view"></main>
</div>
<nav class="nav"><div id="nav"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="app-data.js"></script>
<script>
var DB = window.MiniAppDB ? window.MiniAppDB.load() : null;
var CATS = {coach:'كوتشينغ',course:'كورسات تطويرية',session:'جلسات نفسية',test:'اختبارات تقييم'};

var OF = (DB && DB.offers) ? DB.offers.map(function(o){
  return { id:o.id, cat:o.cat, t:o.t, g:o.hasGroup?1:0, p:o.p, d:o.d, m:o.m, pts:o.pts||[], st:o.subType||'', seats:o.seats||'', maxSeats:o.maxSeats||null, groupName:o.groupName||'' };
}) : [
  ['c1','coach','كوتشينغ التواصل',0,'فردي'],['c2','coach','كوتشينغ البزنس',0,'فردي'],['c3','coach','كوتشينغ جماعي: الحياة والأهداف',1,'جماعي'],
  ['k1','course','إدارة الوقت والتركيز',1,''],['k2','course','بناء الثقة بالنفس',1,''],['k3','course','مهارات القيادة',1,''],
  ['s1','session','جلسة القلق والضغوط',0,''],['s2','session','جلسة العلاقات',0,''],['s3','session','التعافي من الاحتراق',0,''],
  ['t1','test','اختبار الشخصية',0,''],['t2','test','اختبار القلق والتوتر',0,''],['t3','test','اختبار الاحتراق الوظيفي',0,'']
].map(function(a){return{id:a[0],cat:a[1],t:a[2],g:a[3],st:a[4],p:'00$',d:'وصف مختصر للعرض.',m:'',pts:[],seats:''}});

var ME = {n:'سارة',f:'🇸🇦',c:'السعودية',u:'@sa_coord'};
var PERM = Object.assign({edit:true,del:false,add:true}, (DB && DB.perm) || {});
var GR = (function(){var g={};if(DB&&DB.offers)DB.offers.forEach(function(x){if(x.hasGroup)g[x.id]={bot:!!x.botLinked}});return Object.keys(g).length?g:{c3:{bot:true},k1:{bot:true},k2:{bot:true},k3:{bot:false}}})();
var ALL = (DB && DB.subs) || [
  {id:1,n:'عبدالله ر.',u:'@abdullah_r',o:'k1',d:'اليوم',st:'pending'},
  {id:2,n:'هند ك.',u:'@hind_k',o:'c3',d:'أمس',st:'sent'},
  {id:3,n:'فهد ع.',u:'@fahad_a',o:'k3',d:'قبل 3 أيام',st:'joined'},
  {id:4,n:'لمى ص.',u:'@lama_s',o:'s1',d:'قبل 4 أيام',st:'none'},
  {id:5,n:'ماجد س.',u:'@majed_s',o:'k2',d:'قبل أسبوع',st:'joined'},
  {id:6,n:'نوف ب.',u:'@nouf_b',o:'k3',d:'قبل يومين',st:'pending'},
  {id:7,n:'تركي ع.',u:'@turki_a',o:'k1',d:'قبل يومين',st:'failed'}
];
var SUBS = ALL.filter(function(s){return s.u!==ME.u});
var MYSUBS = ALL.filter(function(s){return s.u===ME.u});
if(!MYSUBS.length) MYSUBS = [{id:'ms1',n:ME.n,u:ME.u,o:'k2',st:'none',prog:40,l:'3 من 8 دروس'}];
var NOTES = (DB && DB.notes && DB.notes[ME.u]) || [
  {t:'لا تتخطي تمرين التنفس اليومي قبل النوم، حتى لو كان يومك مزدحم.',ack:false},
  {t:'جهّزي دفتر ملاحظاتك قبل الجلسة القادمة وسجّلي فيه المواقف اللي أقلقتك.',ack:false},
  {t:'تم الاتفاق على تقليل الكافيين بعد الساعة 4 عصراً.',ack:true}
];
var TESTS = (DB && DB.tests && DB.tests[ME.u]) || [
  {id:'t1',date:'قبل أسبوعين',res:'ملف شخصيتك يميل للتحليل والتنظيم. نقطة القوة: التخطيط. نقطة التطوير: التفويض.',tips:'جرّبي تفويض مهمة واحدة أسبوعياً.'}
];
var CO = (DB && DB.coord) || [
  {c:'السعودية',f:'🇸🇦',n:'منسقة السعودية',u:'sa_coord'},{c:'الكويت',f:'🇰🇼',n:'منسقة الكويت',u:'kw_coord'},
  {c:'الإمارات',f:'🇦🇪',n:'منسقة الإمارات',u:'ae_coord'},{c:'قطر',f:'🇶🇦',n:'منسقة قطر',u:'qa_coord'}
];

// ألوان الحالات المميزة كما في شرح.txt:
// بانتظار: أصفر | أُرسل: أزرق | دخل القروب: أخضر | تعذر: أحمر | بدون: رمادي
var ST = {
  pending: ['بانتظار إرسال الرابط ⏳','warn'],
  sent: ['أُرسل الرابط للعميل 🔵','hl'],
  joined: ['دخل القروب 🟢','ok'],
  failed: ['تعذّر الإرسال 🔴','dn'],
  none: ['بدون قروب ⚪','']
};

var S = {tab:'home',sv:'list',q:'',sf:'all',oq:'',cat:'all',coachType:'all',subFilter:'all',msub:'sessions',remind:true,rg:{cat:'',type:'',o:''}};
S.tg = botOk(ME.u);
var $ = function(s){return document.querySelector(s)};
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function o(id){return OF.filter(function(x){return x.id===id})[0] || {t:'عرض',cat:'coach',p:'00$',g:0}}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}
function sw(on,act,id){return '<button class="sw" role="switch" aria-checked="'+on+'" data-act="'+act+'" data-id="'+id+'"></button>'}
function tg(u){return 'https://t.me/'+String(u).replace('@','')}
function chips(arr,cur,act){return '<div class="seg">'+arr.map(function(x){return '<button class="'+(cur===x[0]?'on':'')+'" data-act="'+act+'" data-id="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}

function syncDB(){
  if(!window.MiniAppDB) return;
  var db = window.MiniAppDB.load();
  db.subs = SUBS.concat(MYSUBS);
  db.notes = db.notes || {}; db.notes[ME.u] = NOTES;
  if(db.offers){
    var by={}; db.offers.forEach(function(x){by[x.id]=x});
    db.offers = OF.map(function(x){
      var b = by[x.id]; if(!b) b = {vis:true,feat:false,pts:x.pts||[],m:x.m||'',seats:x.seats||'',maxSeats:x.maxSeats||null,groupName:x.groupName||''};
      b.id=x.id; b.cat=x.cat; b.t=x.t; b.p=x.p; b.d=x.d; b.hasGroup=!!x.g; b.subType=x.st||b.subType||'';
      if(x.g && b.botLinked===undefined) b.botLinked=false;
      return b;
    });
  }
  window.MiniAppDB.save(db);
}
function linked(id){return GR[id]?!!GR[id].bot:false}
function coachTypes(){var t=['فردي','جماعي'];if(OF.some(function(x){return x.st==='باكج'}))t.push('باكج');return t}
function subbed(id){return MYSUBS.some(function(s){return s.o===id})}
function unread(){return NOTES.filter(function(n){return !n.ack}).length}
function botOk(u){return window.MiniAppDB ? window.MiniAppDB.isBotRegistered(u) : (['@noura','@khaled','@reem','@salman','@mona','@abdullah_r','@hind_k','@fahad_a'].indexOf(u.toLowerCase())>-1)}

function checkCoordBotUser(u){
  var el = $('#coordBotCheck'); if(!el) return;
  if(!u || !u.trim()){
    el.innerHTML = '<span style="color:var(--muted)">أدخل يوزر العميل للتحقق من وجوده بالبوت</span>';
    return;
  }
  var ok = window.MiniAppDB ? window.MiniAppDB.isBotRegistered(u) : (['@noura','@khaled','@reem','@salman','@mona','@abdullah_r','@hind_k','@fahad_a'].indexOf(u.toLowerCase())>-1);
  if(ok){
    el.innerHTML = '<span style="color:var(--green);font-weight:500">✓ العميل موجود بقاعدة بيانات البوت (بدأ البوت)</span>';
  } else {
    el.innerHTML = '<span style="color:#EF4444;font-weight:500">✕ اليوزر غير موجود بقاعدة بيانات البوت (لازم يسوي ستارت أولاً)</span>';
  }
}

function rowSub(s){
  var x=o(s.o),st=ST[s.st]||ST.none,a=s.st==='pending'||s.st==='failed';
  return '<div class="panel">'+
    '<div class="row"><div><b>'+esc(s.n)+'</b> <small class="lbl" dir="ltr">'+esc(s.u||'')+'</small><br><small class="lbl">'+x.t+' · '+s.d+'</small></div>'+
    '<span class="pill '+st[1]+'">'+st[0]+'</span></div>'+
    '<div class="row" style="margin-top:10px;gap:6px">'+
      '<button class="btn '+(a?'primary':'')+' sm" data-act="sub" data-id="'+s.id+'">'+(s.st==='pending'?'إرسال الرابط':s.st==='failed'?'إعادة المحاولة':'التفاصيل والإجراءات')+'</button>'+
      '<button class="btn sm" data-act="editsub" data-id="'+s.id+'">✏️ تعديل</button>'+
      '<button class="btn sm" data-act="delsub" data-id="'+s.id+'">🗑️</button>'+
    '</div>'+
  '</div>';
}

function need(){return SUBS.filter(function(s){return s.st==='pending'||s.st==='failed'})}
function sentWaiting(){return SUBS.filter(function(s){return s.st==='sent'})}
function home(){
 var pn=need(), sw=sentWaiting();
 return '<section class="hero"><h1>أهلاً '+ME.n+' 👋</h1><p>منسقة '+ME.c+' '+ME.f+'. إدارة الاشتراكات والروابط.</p></section>'+
 '<div class="stats" style="margin-top:12px">'+

  h='<label class="lbl" for="at">نوع الكوتشينغ</label><select class="in" id="at"><option'+(at==='فردي'?' selected':'')+'>فردي</option><option'+(at==='جماعي'?' selected':'')+'>جماعي</option></select>';
  if(at==='فردي') h+=N('كوتشينغ فردي: مقعد واحد تلقائياً وبدون قروب.');
  else h+='<label class="lbl" for="asm">المقاعد</label><select class="in" id="asm"><option value="limited"'+(sm==='limited'?' selected':'')+'>عدد محدود</option><option value="open"'+(sm==='open'?' selected':'')+'>غير محدودة</option></select>'+(sm==='limited'?'<label class="lbl" for="acn">عدد المقاعد</label><input class="in" id="acn" type="number" min="1" inputmode="numeric" value="'+esc(cn)+'">':'')+N('كوتشينغ جماعي: له قروب، ويتفعل إرسال الرابط بعد ما يربطه الأدمن بالبوت.');
 } else if(ac==='course') h=N('كورس تعليمي: له قروب وبدون حد للمقاعد، ويتفعل إرسال الرابط بعد ما يربطه الأدمن بالبوت.');
 else h=N((ac==='session'?'جلسة نفسية':'اختبار تقييم')+': فردي وبدون قروب.');
 $('#adyn').innerHTML=h;
}
function subSheet(id){
 var s=SUBS.filter(function(x){return x.id==id})[0];
 if(!s) return;
 var x=o(s.o),st=ST[s.st]||ST.none,b;
 var bot=linked(x.id);
 if(!x.g) b='<div class="panel"><p style="margin:0">هذا العرض بدون قروب، تم تأكيد الاشتراك بنجاح.</p></div>';
 else{
  var m={pending:'البوت يرسل رابط الدخول للعميل مباشرة عند الضغط على إرسال الرابط.',sent:'أرسل البوت الرابط للعميل. بانتظار دخوله للقروب.',joined:'دخل العميل القروب بنجاح ✓. لا تحتاجين لأي إجراء.',failed:'تعذّر إرسال الرابط، غالباً لأن العميل لم يفتح البوت. اطلبي منه يفتحه ثم أعيدي الإرسال.'}[s.st];
  b='<div class="panel"><h3>'+x.t+'</h3><p style="margin:4px 0 0">'+m+'</p>'+(bot?'':'<p style="margin:8px 0 0;color:var(--amber)">⚠️ البوت غير مربوط بقروب هذا العرض. زر الإرسال معطل حتى يربطه الأدمن.</p>')+'</div>'+
  (s.st==='joined'?'':'<button class="btn primary block'+(bot?'':' dis')+'" data-act="send" data-id="'+s.id+'">'+(s.st==='pending'?'إرسال الرابط للعميل':'إعادة إرسال الرابط')+'</button>')+
  (s.st==='failed'?'<div style="margin-top:8px"><a class="btn block" href="'+tg(s.u)+'" target="_blank" rel="noopener">فتح محادثة العميل على تيليجرام</a></div>':'')+
  (s.st==='sent'?'<div style="margin-top:8px"><button class="btn block" data-act="join" data-id="'+s.id+'">(تجربة) محاكاة: العميل دخل القروب 🟢</button></div>':'')}

 sheet('<span class="pill '+st[1]+'">'+st[0]+'</span><h2 style="margin:8px 0 2px">'+esc(s.n)+'</h2>'+
   '<small class="lbl">'+esc(s.u)+' · '+x.t+' · '+s.d+'</small>'+
   '<div style="margin-top:12px">'+b+'</div>'+
   '<div class="row" style="margin-top:14px;gap:8px">'+
     '<button class="btn sm" data-act="editsub" data-id="'+s.id+'">✏️ تعديل الاشتراك</button>'+
     '<button class="btn sm" data-act="delsub" data-id="'+s.id+'">🗑️ حذف الاشتراك</button>'+
   '</div>');
}

function editSubSheet(id){
  var s=SUBS.filter(function(x){return x.id==id})[0];
  if(!s) return;
  sheet('<h2 style="margin:4px 0 8px">تعديل اشتراك العميل</h2>'+
    '<p class="desc">يمكنك تصحيح الاسم أو اليوزر في حال وجود خطأ يعطل إرسال الرابط.</p>'+
    '<label class="lbl" for="ern">اسم العميل</label><input class="in" id="ern" value="'+esc(s.n)+'">'+
    '<label class="lbl" for="eru">يوزر تيليجرام</label><input class="in" id="eru" value="'+esc(s.u)+'" dir="ltr">'+
    '<div id="coordEditBotCheck" style="font-size:12px;margin:-2px 0 8px"></div>'+
    '<label class="lbl" for="ero">العرض</label><select class="in" id="ero">'+
      OF.map(function(x){return '<option value="'+x.id+'"'+(x.id===s.o?' selected':'')+'>'+x.t+'</option>'}).join('')+
    '</select>'+
    '<button class="btn primary block" data-act="saveeditsub" data-id="'+s.id+'">حفظ التعديل</button>'+
    '<div style="margin-top:8px"><button class="btn block" data-act="close">إلغاء</button></div>');
}

function delSubSheet(id){
  var s=SUBS.filter(function(x){return x.id==id})[0];
  if(!s) return;
  sheet('<h2 style="margin:4px 0 8px">حذف الاشتراك؟</h2>'+
    '<p class="desc">هل أنتِ متأكدة من حذف اشتراك «'+esc(s.n)+' ('+esc(s.u)+')» في '+o(s.o).t+'؟</p>'+
    '<button class="btn primary block" data-act="confirmdelsub" data-id="'+s.id+'">نعم، احذف الاشتراك</button>'+
    '<div style="margin-top:8px"><button class="btn block" data-act="close">إلغاء</button></div>');
}

function gSheet(id){
 var x=o(id),bot=GR[id]?GR[id].bot:true,m=SUBS.filter(function(s){return s.o===id});
 sheet('<h2 style="margin:4px 0 6px">'+x.t+'</h2><span class="pill '+(bot?'ok':'warn')+'">'+(bot?'البوت مربوط بالقروب ✓':'البوت غير مربوط بالقروب')+'</span>'+
   (bot?'':'<p class="desc" style="margin-top:8px">الأدمن هو اللي يربط البوت بالقروب. بعدها يتفعل إرسال الرابط.</p>')+
   '<h2>الأعضاء من طرفك ('+m.length+')</h2>'+
   (m.length?m.map(function(s){var st=ST[s.st]||ST.none;return '<div class="panel"><div class="row"><div><b>'+esc(s.n)+'</b><br><small class="lbl" dir="ltr">'+esc(s.u)+'</small></div><span class="pill '+st[1]+'">'+st[0]+'</span></div></div>'}).join(''):'<p class="desc">ما أضفتِ أعضاء لهذا القروب بعد.</p>'));
}

function ofSheet(id){var x=o(id);sheet('<h2 style="margin:4px 0 8px">تعديل العرض</h2><label class="lbl" for="ot">الاسم</label><input class="in" id="ot" value="'+esc(x.t)+'"><label class="lbl" for="op">السعر</label><input class="in" id="op" value="'+esc(x.p)+'"><label class="lbl" for="od">الوصف</label><textarea id="od">'+esc(x.d)+'</textarea>'+(x.g?'<p class="desc">رابط القروب يحدده الأدمن.</p>':'')+'<button class="btn primary block" data-act="saveof" data-id="'+id+'">حفظ</button>')}
function delSheet(id){var x=o(id);sheet('<h2 style="margin:4px 0 8px">حذف العرض؟</h2><p class="desc">سيُحذف «'+x.t+'» ولن يظهر للعملاء. هذا الإجراء لا يمكن التراجع عنه.</p><button class="btn primary block" data-act="rmof" data-id="'+id+'">نعم، احذف العرض</button><div style="margin-top:8px"><button class="btn block" data-act="close">إلغاء</button></div>')}

function act(el){
 var a=el.dataset.act,id=el.dataset.id,v=function(s){return $(s).value.trim()};
 if(a==='go'){S.tab=id;render();scrollTo(0,0)}
 else if(a==='sf'){S.sf=id;render()}else if(a==='cat'){S.cat=id;if(id!=='coach')S.coachType='all';render()}
 else if(a==='coachType'){S.coachType=id;render()}else if(a==='subFilter'){S.subFilter=id;render()}
 else if(a==='msub'){S.msub=id;render()}
 else if(a==='open')offerSheet(id);
 else if(a==='contact')contactSheet();
 else if(a==='remind'){S.remind=!S.remind;toast(S.remind?'تم تفعيل التذكير':'تم إيقاف التذكير');render()}
 else if(a==='ack'){NOTES[+id].ack=true;syncDB();toast('تم تأكيد قراءة الملاحظة');render()}
 else if(a==='tg'){
   S.tg=!S.tg;
   if(window.MiniAppDB){var db=window.MiniAppDB.load(),bu=String(ME.u).toLowerCase();bu=bu[0]==='@'?bu:'@'+bu;db.botUsers=(db.botUsers||[]).filter(function(x){return String(x).toLowerCase()!==bu});if(S.tg)db.botUsers.push(bu);window.MiniAppDB.save(db)}
   toast(S.tg?'تم تشغيل تنبيهات تيليجرام بنجاح 🔔':'تم إيقاف التنبيهات 🔕');render();
 }
 else if(a==='confirmreg')confirmReg();
 else if(a==='viewsub'){var vs=SUBS.filter(function(x){return x.id==id})[0];S.tab='subs';S.sv='list';S.sf='all';S.q=vs?vs.n:'';closeSheet();render();scrollTo(0,0)}
 else if(a==='rcat'){S.rg={cat:id,type:'',o:''};refreshPick()}
 else if(a==='rtype'){S.rg.type=id;S.rg.o='';refreshPick()}
 else if(a==='rpick'){S.rg.o=id;refreshPick()}
 else if(a==='addof'){if(!PERM.add){toast('🔒 الأدمن ما أعطاك صلاحية إضافة العروض');return}addOfSheet()}
 else if(a==='saveadd'){
   var an=v('#an'),ac=$('#ac').value,ap=v('#ap');
   if(!an){toast('اكتبي اسم العرض');return}
   if(!ap){toast('اكتبي السعر');return}
   var at=ac==='coach'?$('#at').value:'',g=(ac==='course'||(ac==='coach'&&at==='جماعي'))?1:0,seats='',mx=null,m='';
   if(ac==='coach'&&at==='فردي'){seats='مقعد فردي خاص (كرسي واحد)';mx=1;m='جلسات فردية'}
   else if(ac==='coach'){m='جلسات جماعية';if($('#asm').value==='limited'){var c=parseInt($('#acn').value,10);if(!(c>0)){toast('اكتبي عدد المقاعد');return}mx=c;seats='كراسي محددة ('+c+' مقعد فقط)'}else seats='مقاعد مفتوحة (غير محدودة)'}
   else if(ac==='course'){seats='مقاعد مفتوحة (بدون حد)';m='كورس تعليمي'}
   else m=ac==='session'?'جلسات فردية':'اختبار تقييمي';
   var nid='n'+Date.now();
   OF.push({id:nid,cat:ac,t:an,g:g,p:ap,d:v('#ad'),m:m,pts:[],st:at,seats:seats,maxSeats:mx,groupName:g?('قروب '+an):''});
   if(g)GR[nid]={bot:false};
   syncDB();closeSheet();toast(g?'تمت إضافة العرض. ربط القروب بالبوت يتم من الأدمن':'تمت إضافة العرض');render();
 }
 else if(a==='close')closeSheet();
 else if(a==='reg')regSheet();
 else if(a==='sub')subSheet(id);
 else if(a==='editsub')editSubSheet(id);
 else if(a==='saveeditsub'){
   var s=SUBS.filter(function(x){return x.id==id})[0];
   if(!s) return;
   var nu = v('#eru'); if(nu && nu[0]!=='@') nu = '@'+nu;
   s.n = v('#ern') || s.n;
   s.u = nu || s.u;
   s.o = $('#ero').value;
   syncDB();
   toast('تم حفظ تعديل الاشتراك بنجاح ✓');
   subSheet(id);
   render();
 }
 else if(a==='delsub')delSubSheet(id);
 else if(a==='confirmdelsub'){
   SUBS = SUBS.filter(function(x){return x.id!=id});
   syncDB();
   closeSheet();
   toast('تم حذف الاشتراك بنجاح');
   render();
 }
 else if(a==='sv'){S.sv=id;render()}
 else if(a==='grp')gSheet(id);
 else if(a==='send'){
   var q=SUBS.filter(function(s){return s.id==id})[0];
   var bot=linked(q.o);
   if(!bot){toast('⚠️ البوت غير مربوط بقروب هذا العرض. تواصل مع الأدمن لربطه');return}
   q.st='sent';
   syncDB();
   render();
   subSheet(id);
   toast('أرسل البوت الرابط للعميل مباشرة 🔵');
 }
 else if(a==='join'){
   var q=SUBS.filter(function(s){return s.id==id})[0];
   q.st='joined';
   if(window.MiniAppDB){
     var db=window.MiniAppDB.load();
     db.botLog = db.botLog || [];
     db.botLog.unshift({ id:Date.now(), time:'الآن', msg:'دخل العميل '+q.u+' قروب '+o(q.o).t+' وتم إشعار المنسقة والأدمن 🟢' });
     window.MiniAppDB.save(db);
   }
   syncDB();
   closeSheet();
   toast('دخل العميل القروب بنجاح وتم تحديث حالته 🟢');
   render();
 }
  else if(a==='of'){
   if(!PERM.edit){toast('🔒 الأدمن ما أعطاك صلاحية تعديل العروض');return}
   ofSheet(id);
 }
 else if(a==='saveof'){
   var x=o(id);
   if(!v('#ot')){toast('اكتب اسم العرض');return}
   x.t=v('#ot');x.p=v('#op');x.d=v('#od');
   syncDB();closeSheet();toast('تم حفظ التعديل');render();
 }
 else if(a==='del'){
   if(!PERM.del){toast('🔒 الأدمن ما أعطاك صلاحية حذف العروض');return}
   delSheet(id);
 }
 else if(a==='rmof'){OF=OF.filter(function(x){return x.id!==id});syncDB();closeSheet();toast('تم حذف العرض');render()}
  else if(a==='theme')setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
}
function setTheme(m){document.documentElement.dataset.theme=m;$('#thl').textContent=m==='light'?'فاتح':'دارك';try{localStorage.setItem('theme',m)}catch(e){}}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&el.tagName!=='A')act(el);else if(e.target.id==='ov')closeSheet()});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;$('#sl').innerHTML=slist()}
  if(e.target.id==='oq'){S.oq=e.target.value;$('#ol').innerHTML=olist()}
  if(e.target.id==='ru'){checkCoordBotUser(e.target.value)}
});
document.addEventListener('change',function(e){if(['ac','at','asm'].indexOf(e.target.id)>-1&&$('#adyn'))addDyn()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
var saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
render();
</script>
</body>
</html>
