<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عروضي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--panel:#0F1A2B;--cardA:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.02);--stroke:rgba(255,255,255,.12);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.70);--blue:#2DD4FF;--blue2:#4F8BFF;--green:#22C55E;--amber:#FBBF24;--fill:rgba(255,255,255,.06);--shadow:0 18px 55px rgba(0,0,0,.45);--navbg:rgba(15,26,43,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F3F6FB;--panel:#FFFFFF;--cardA:rgba(0,0,0,.04);--cardB:rgba(0,0,0,.02);--stroke:rgba(0,0,0,.10);--text:rgba(10,16,24,.92);--muted:rgba(10,16,24,.65);--fill:rgba(0,0,0,.04);--shadow:0 18px 55px rgba(0,0,0,.16);--navbg:rgba(255,255,255,.94);--amber:#D97706}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 600px at 85% -10%,rgba(45,212,255,.22),transparent 55%),radial-gradient(700px 500px at 5% 0%,rgba(34,197,94,.16),transparent 60%),var(--bg);background-color:var(--bg);line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:12px 14px 100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top b{font-size:20px}
.chip,.toggle{border:1px solid var(--stroke);background:var(--fill);border-radius:999px;padding:8px 12px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:99px;background:linear-gradient(180deg,var(--blue),var(--green))}
.dot.off{background:var(--muted);opacity:.5}
h2{font-size:18px;margin:22px 0 10px}
.hero{border:1px solid var(--stroke);background:linear-gradient(135deg,rgba(79,139,255,.16),rgba(34,197,94,.10));border-radius:22px;padding:18px}
.hero h1{margin:0 0 4px;font-size:24px}
.hero p{margin:0;color:var(--muted)}
.carousel{margin:0 -14px;overflow-x:auto;padding:4px 0;scrollbar-width:none;cursor:grab}
.carousel::-webkit-scrollbar{display:none}
.carousel.drag{cursor:grabbing;user-select:none}
.track{display:flex;width:max-content}
.track .card{width:265px;margin-inline-end:12px;flex:none}
.card{position:relative;overflow:hidden;border:1px solid var(--stroke);border-radius:18px;padding:14px;background:linear-gradient(180deg,var(--cardA),var(--cardB));margin-bottom:12px;cursor:pointer}
.card:hover{border-color:rgba(45,212,255,.55)}
.glow{position:absolute;inset:-70px -70px auto auto;width:180px;height:180px;background:radial-gradient(circle at 30% 30%,rgba(45,212,255,.25),transparent 60%),radial-gradient(circle at 70% 60%,rgba(34,197,94,.18),transparent 62%);pointer-events:none}
.card>*{position:relative}
.tag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--stroke);background:var(--fill);color:var(--muted)}
.card h3{margin:8px 0 2px;font-size:17px}
.desc{margin:0 0 8px;color:var(--muted);font-size:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--stroke);background:var(--fill)}
.price{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12);font-weight:700}
.star{color:var(--amber);font-size:13px}
.ok{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:16px;padding:14px;text-align:right}
.cat span{font-size:22px;display:block}
.cat small{color:var(--muted)}
.btn{border:1px solid var(--stroke);background:var(--fill);border-radius:12px;padding:11px 14px;font-size:14px;text-decoration:none;color:var(--text);display:inline-flex;justify-content:center;align-items:center;gap:6px}
.btn.primary{border-color:rgba(45,212,255,.7);background:rgba(45,212,255,.14)}
.btn.block{width:100%}
.panel{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:18px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel p{margin:0 0 8px;color:var(--muted);font-size:14px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin:8px 0;color:var(--muted);font-size:14px}
.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:rgba(45,212,255,.15);color:var(--blue);font-weight:700;font-size:13px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.seg button{flex:none;border:1px solid var(--stroke);background:var(--fill);border-radius:99px;padding:8px 14px;font-size:14px}
.seg button.on{border-color:rgba(45,212,255,.7);background:rgba(45,212,255,.14);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
.note{border:1px solid rgba(251,191,36,.55);background:rgba(251,191,36,.10);border-radius:14px;padding:12px;margin:8px 0}
.note.done{border-color:var(--stroke);background:var(--fill);opacity:.8}
.note b{font-size:13px;color:var(--amber)}
.note.done b{color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{width:46px;height:26px;border-radius:99px;border:1px solid var(--stroke);background:var(--fill);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:99px;background:var(--muted);transition:.2s}
.sw[aria-checked=true]{background:rgba(34,197,94,.3)}
.sw[aria-checked=true]:after{inset-inline-start:22px;background:var(--green)}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--navbg);border-top:1px solid var(--stroke);backdrop-filter:blur(12px);z-index:5}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--muted);position:relative}
.nav button span{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--blue);font-weight:700}
.badge{position:absolute;top:4px;inset-inline-start:50%;margin-inline-start:6px;background:#EF4444;color:#fff;font-size:10px;border-radius:99px;min-width:16px;height:16px;line-height:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.ov.show{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;max-height:88%;overflow-y:auto;background:var(--panel);border:1px solid var(--stroke);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--stroke);margin:0 auto 10px}
.rev{border-top:1px solid var(--stroke);padding:10px 0;font-size:14px}
.rev small{color:var(--muted)}
.stars button{border:0;background:none;font-size:28px;color:var(--muted);padding:0 2px}
.stars button.on{color:var(--amber)}
textarea{width:100%;font:inherit;color:var(--text);background:var(--fill);border:1px solid var(--stroke);border-radius:12px;padding:10px;min-height:70px;margin:6px 0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;display:none}
.co{display:flex;align-items:center;gap:12px}
.co .fl{font-size:28px}
.co>div{flex:1}
.co small{color:var(--muted)}
.hl{border-color:rgba(45,212,255,.8)}
@keyframes fadeOutDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(14px)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-out{animation:fadeOutDown .3s ease forwards}
.fade-in{animation:fadeInUp .3s ease forwards}
.sub-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.sub-filters button{flex:none;border:1px solid var(--stroke);background:var(--fill);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--muted);cursor:pointer;transition:.2s}
.sub-filters button.on{border-color:rgba(45,212,255,.8);background:rgba(45,212,255,.16);color:var(--text);font-weight:700}
.sub-filters button.sub-active{border-color:rgba(34,197,94,.8);background:rgba(34,197,94,.16);color:var(--green);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <b id="ttl">عروضي</b>
    <div class="row" style="gap:6px;flex-wrap:wrap;justify-content:flex-end">
      <a class="chip" href="index.html" style="text-decoration:none" title="الرجوع للرئيسية"><span class="dot"></span><span id="userGreeting">نورة ع. (@noura)</span> <span style="font-size:11px;opacity:.7">خروج ↵</span></a>

<script>

var OFFERS = (DB && DB.offers) || [
{id:'c1',cat:'coach',t:'كوتشينغ التواصل',d:'تتعلم تعبّر عن نفسك وتسمع غيرك بوضوح وثقة.',m:'6 جلسات · 60 دقيقة',p:'95$',pts:['تحديد أنماط التواصل عندك','تمارين تطبيقية بين الجلسات','خطة متابعة بعد الانتهاء']},

{id:'s2',cat:'session',t:'جلسة العلاقات',d:'لفهم أنماطك في العلاقات وتحسينها.',m:'جلسات 50 دقيقة',p:'95$',pts:['استكشاف الأنماط','وضع الحدود','تمارين تواصل']},

{id:'t2',cat:'test',t:'اختبار القلق والتوتر',d:'يقيس مستوى التوتر الحالي لديك.',m:'15 دقيقة · النتيجة من المختص',p:'25$',pts:['مقياس معتمد','قراءة النتيجة لك','يُعاد كل شهرين']},
{id:'t3',cat:'test',t:'اختبار الاحتراق الوظيفي',d:'تعرف إذا كان ضغط العمل بدأ يأثر عليك.',m:'15 دقيقة · النتيجة من المختص',p:'25$',pts:['مقياس معتمد','خطة مقترحة','متابعة بعد 3 أشهر']}];
var REV = (DB && DB.reviews) || {c1:[{n:'نورة',s:5,t:'غيّرت طريقة كلامي مع فريقي، أنصح فيها.'},{n:'خالد',s:4,t:'تمارين مفيدة وواضحة.'}],k1:[{n:'ريم',s:5,t:'مرتب وسهل، طبّقته من أول يوم.'}],s1:[{n:'م.',s:5,t:'حسّيت بأمان وراحة.'}],t1:[{n:'سلمان',s:4,t:'التفسير كان دقيق.'}]};

var CUR_USER = (window.MiniAppDB && window.MiniAppDB.getCurrentUser()) || { u:'@noura', name:'نورة ع.', role:'client' };
var SUBS = (DB && DB.subs ? DB.subs.filter(function(s){ return s.u === CUR_USER.u; }) : [
  {id:'c1',prog:50,l:'الجلسة 3 من 6'},{id:'k1',prog:40,l:'4 من 10 دروس'},{id:'s1',prog:33,l:'الجلسة 2 من 6'}
]);
if(!SUBS.length) SUBS = [{id:'c1',prog:50,l:'الجلسة 3 من 6'},{id:'k1',prog:40,l:'4 من 10 دروس'},{id:'s1',prog:33,l:'الجلسة 2 من 6'}];

var NOTES = (DB && DB.notes && DB.notes[CUR_USER.u]) || [
  {t:'لا تتخطى تمرين التنفس اليومي قبل النوم، حتى لو كان يومك مزدحم.',ack:false},
  {t:'جهّز دفتر ملاحظاتك قبل الجلسة القادمة وسجّل فيه المواقف اللي أقلقتك.',ack:false},
  {t:'تم الاتفاق على تقليل الكافيين بعد الساعة 4 عصراً.',ack:true}
];

var TESTS = (DB && DB.tests && DB.tests[CUR_USER.u]) || [
  {id:'t1',date:'قبل أسبوعين',res:'ملف شخصيتك يميل للتحليل والتنظيم. نقطة القوة: التخطيط. نقطة التطوير: التفويض. راجع التوصيات أدناه.',tips:'جرّب تفويض مهمة واحدة أسبوعياً.'}
];

var COORD = (DB && DB.coord) || [
  {c:'السعودية',f:'🇸🇦',n:'منسقة السعودية',h:'9 ص – 9 م بتوقيت الرياض',u:'sa_coord'},
  {c:'الكويت',f:'🇰🇼',n:'منسقة الكويت',h:'9 ص – 9 م بتوقيت الكويت',u:'kw_coord'},
  {c:'الإمارات',f:'🇦🇪',n:'منسقة الإمارات',h:'10 ص – 8 م بتوقيت دبي',u:'ae_coord'},
  {c:'قطر',f:'🇶🇦',n:'منسقة قطر',h:'9 ص – 9 م بتوقيت الدوحة',u:'qa_coord'},
  {c:'دول أخرى',f:'🌍',n:'منسقة عامة',h:'حسب التوفر',u:'global_coord'}
];

var S={tab:'home',cat:'all',coachType:'all',subFilter:'all',sub:'sessions',tg:true,remind:true,hl:false,rate:0,pick:null,paused:matchMedia('(prefers-reduced-motion: reduce)').matches};
var mq={raf:0,pos:0,hold:false,hov:false,idle:0,last:0,prog:false,down:false,moved:false};
function stopMq(){cancelAnimationFrame(mq.raf);mq.raf=0}
function initMq(){
 stopMq();var el=$('#mq');if(!el)return;
 var now=function(){return performance.now()};
 mq.pos=mq.pos||el.scrollWidth/2;el.scrollLeft=-mq.pos;mq.prog=true;mq.last=0;
 function tick(t){
  var half=el.scrollWidth/2,max=el.scrollWidth-el.clientWidth,dt=Math.min(50,t-(mq.last||t));mq.last=t;
  var auto=!S.paused&&!mq.hold&&!mq.hov&&t>mq.idle,wrote=false;
  if(auto){mq.pos+=0.035*dt;wrote=true}else mq.pos=Math.abs(el.scrollLeft);
  if(mq.pos>max-2){mq.pos-=half;wrote=true}
  if(mq.pos<1){mq.pos+=half;wrote=true}
  if(wrote){mq.prog=true;el.scrollLeft=-mq.pos}
  mq.raf=requestAnimationFrame(tick)}
 el.addEventListener('scroll',function(){if(mq.prog){mq.prog=false;return}mq.idle=now()+2500});
 el.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')mq.hov=true});
 el.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){mq.hov=false;mq.idle=now()+800}});
 el.addEventListener('pointerdown',function(e){mq.hold=true;mq.moved=false;if(e.pointerType==='mouse'){mq.down=true;mq.sx=e.clientX;mq.ss=el.scrollLeft}});
 el.addEventListener('pointermove',function(e){if(!mq.down)return;var dx=e.clientX-mq.sx;if(Math.abs(dx)>5&&!mq.moved){mq.moved=true;el.setPointerCapture(e.pointerId);el.classList.add('drag')}if(mq.moved)el.scrollLeft=mq.ss-dx});
 function end(){mq.down=false;mq.hold=false;el.classList.remove('drag');mq.idle=now()+2500}
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('click',function(e){if(mq.moved){e.stopPropagation();e.preventDefault();mq.moved=false}},true);
 mq.raf=requestAnimationFrame(tick)}
var $=function(s){return document.querySelector(s)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function get(id){return OFFERS.filter(function(o){return o.id===id})[0]}
function avg(id){var r=REV[id]||[];if(!r.length)return '';var a=r.reduce(function(x,y){return x+y.s},0)/r.length;return '<span class="star">★ '+a.toFixed(1)+'</span> <small>('+r.length+')</small>'}
function subbed(id){return SUBS.some(function(s){return s.id===id || s.o===id})}
function unread(){return NOTES.filter(function(n){return !n.ack}).length}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}

function card(o){
 var catName = CATS[o.cat] ? CATS[o.cat].n : o.cat;

 var seatsBadge = o.seats ? ('<span class="pill" style="border-color:rgba(45,212,255,.35);background:rgba(45,212,255,.08)">💺 '+esc(o.seats)+'</span>') : '';
 var groupBadge = o.hasGroup ? ('<span class="pill" style="border-color:rgba(79,139,255,.35)">👥 قروب تفاعلي</span>') : '<span class="pill" style="opacity:.75">👤 فردي خاص بدون قروب</span>';
 var isSub = subbed(o.id);
 var subBadge = isSub ? '<span class="pill ok">مشترك ✓</span>' : '';
 return '<article class="card" tabindex="0" data-act="open" data-id="'+o.id+'">'+
   '<div class="glow"></div>'+
   '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><span class="tag">'+catName+'</span>'+subTypeBadge+'</div>'+
   '<h3>'+o.t+'</h3>'+
   '<p class="desc">'+o.d+'</p>'+
   '<div class="meta">'+
     '<span class="pill">'+o.m+'</span>'+
     '<span class="pill price">السعر: '+o.p+'</span>'+
     seatsBadge+
     groupBadge+
     subBadge+
     avg(o.id)+
   '</div>'+
 '</article>';
}

function home(){
 var feat=OFFERS.filter(function(o){return ['c1','k1','s1','t1','c2','c3','c4'].indexOf(o.id)>-1}).map(card).join('');
 var cats=Object.keys(CATS).map(function(k){var n=OFFERS.filter(function(o){return o.cat===k}).length;return '<button class="cat" data-act="cat" data-id="'+k+'"><span>'+CATS[k].i+'</span><b>'+CATS[k].n+'</b><br><small>'+n+' عروض</small></button>'}).join('');
 var nxt=S.remind?'سنذكّرك على تيليجرام قبل الموعد.':'فعّل التذكير ليوصلك على تيليجرام.';
 return '<section class="hero"><h1>أهلاً بك '+esc(CUR_USER.name)+' 👋</h1><p>كل عروضك واشتراكاتك وملاحظاتك ونتائجك في مكان واحد.</p></section>'+
 '<div class="row"><h2>العروض السنوية</h2><button class="chip" id="mqb" data-act="mq">'+(S.paused?'▶ تشغيل':'⏸ إيقاف')+'</button></div><p class="desc" style="margin:-4px 0 6px;font-size:12px">اسحب البطاقات بإصبعك لتحريكها، أو اضغط إيقاف.</p><div class="carousel" id="mq"><div class="track">'+feat+'<span aria-hidden="true" style="display:contents">'+feat.replace(/tabindex="0"/g,'tabindex="-1"')+'</span></div></div>'+
 '<h2>تصفّح حسب الفئة</h2><div class="cats">'+cats+'</div>'+
 '<h2>التالي عليك</h2><div class="panel"><div class="row"><h3>إعادة اختبار القلق والتوتر</h3><span class="pill">بعد 12 يوم</span></div><p>'+nxt+'</p><button class="btn block" data-act="goto" data-id="mine:tests">افتح الاختبارات</button></div>'+
 '<h2>كيف أشترك؟</h2><div class="panel"><ol class="steps"><li>اختر العرض اللي يناسبك واقرأ تفاصيله.</li><li>تواصل مع منسقة بلدك على تيليجرام برسالة العرض الجاهزة.</li><li>تؤكد لك المنسقة الاشتراك ويظهر عندك هنا مباشرة.</li></ol><button class="btn primary block" data-act="goto" data-id="help">تواصل مع المنسقة</button></div>'}

function offers(){
 var seg=['all'].concat(Object.keys(CATS)).map(function(k){return '<button class="'+(S.cat===k?'on':'')+'" data-act="cat" data-id="'+k+'">'+(k==='all'?'الكل':CATS[k].n)+'</button>'}).join('');

 var coachSubRow = '';
 if(S.cat==='coach'){
   var coachTypes=[
     ['all','كل الكوتشينغ'],
     ['فردي','فردي (مقعد خاص)'],
     ['جماعي','جماعي (قروب)'],
     ['باكج','باكج مجمّع']
   ];
   coachSubRow = '<div class="sub-filters" style="margin-top:4px">'+
     coachTypes.map(function(ct){
       return '<button class="'+(S.coachType===ct[0]?'on':'')+'" data-act="coachType" data-id="'+ct[0]+'">'+ct[1]+'</button>';
     }).join('')+
   '</div>';
 }

 var subStatusRow = '<div class="sub-filters" style="margin-top:2px;margin-bottom:14px">'+
   [
     ['all','الكل'],
     ['subbed','مشترك فقط ✓'],
     ['unsubbed','غير مشترك']
   ].map(function(st){
     var isAct = S.subFilter===st[0];
     var cls = isAct ? (st[0]==='subbed'?'sub-active':'on') : '';
     return '<button class="'+cls+'" data-act="subFilter" data-id="'+st[0]+'">'+st[1]+'</button>';
   }).join('')+
 '</div>';

 var filtered = OFFERS.filter(function(o){
   if(S.cat!=='all' && o.cat!==S.cat) return false;
   if(S.cat==='coach' && S.coachType!=='all' && o.subType!==S.coachType) return false;
   if(S.subFilter==='subbed' && !subbed(o.id)) return false;
   if(S.subFilter==='unsubbed' && subbed(o.id)) return false;
   return true;
 });

 var list = filtered.length ? filtered.map(card).join('') : '<div class="panel" style="text-align:center;padding:26px"><p class="desc" style="margin:0;font-size:15px">لا توجد عروض مطابقة لهذه التصفية حالياً.</p></div>';

 return '<div class="seg">'+seg+'</div>'+coachSubRow+subStatusRow+list}

function mine(){
 var seg=[['sessions','الجلسات النفسية'],['tests','الاختبارات والتقييم']].map(function(x){return '<button class="'+(S.sub===x[0]?'on':'')+'" data-act="sub" data-id="'+x[0]+'">'+x[1]+(x[0]==='sessions'&&unread()?' ('+unread()+')':'')+'</button>'}).join('');
 var b='';
 if(S.sub==='sessions'){
  b='<h2 style="margin-top:6px">ملاحظات المختص السرية</h2><p class="desc">ملاحظات يرسلها لك المختص بعد كل جلسة. اقرأ كل ملاحظة وأكّد قراءتك ليعلم المختص باطلاعك عليها.</p>'+
  NOTES.map(function(n,i){return '<div class="note'+(n.ack?' done':'')+'"><b>'+(n.ack?'✓ تمت القراءة':'⚠ ملاحظة سرية من المختص')+'</b><p style="margin:4px 0 8px;color:var(--text)">'+n.t+'</p>'+(n.ack?'':'<button class="btn block" data-act="ack" data-id="'+i+'">قرأتها وفهمتها</button>')+'</div>'}).join('')}
 if(S.sub==='tests'){
  b=TESTS.map(function(t){var o=get(t.id)||{t:'اختبار الشخصية'};return '<div class="panel"><span class="tag">مكتمل · '+t.date+'</span><h3 style="margin-top:8px">'+o.t+'</h3><p>نتيجتك من المختص:</p><div class="note done"><p style="margin:0;color:var(--text)">'+t.res+'</p></div><p>💡 '+t.tips+'</p><button class="btn" data-act="open" data-id="'+o.id+'" data-hl="1">تفاصيل أو قيّم</button></div>'}).join('')+
  '<div class="panel"><span class="tag">بانتظارك</span><h3 style="margin-top:8px">اختبار القلق والتوتر النفسي</h3><p>يُعاد كل شهرين · الموعد القادم بعد 12 يوم</p><div class="row"><span style="font-size:14px">إشعار تيليجرام عند حلول الموعد</span><button class="sw" role="switch" aria-checked="'+S.remind+'" aria-label="تنبيه تيليجرام" data-act="remind"></button></div><div style="margin-top:12px"><button class="btn primary block" data-act="goto" data-id="help">طلب موعد الاختبار عبر المنسقة</button></div></div>'}
 return '<div class="seg">'+seg+'</div>'+b}

function help(){
 var co=COORD.map(function(c,i){
   var u = window.MiniAppDB ? window.MiniAppDB.buildCoordTelegramUrl(c.u, 'استفسار عام', 'الخدمات', 'عروض') : ('https://t.me/'+c.u.replace('@',''));
   return '<div class="panel'+(S.pick===i?' hl':'')+'"><div class="co"><span class="fl">'+c.f+'</span><div><b>'+c.n+'</b><br><small>'+c.h+'</small></div><a class="btn primary" href="'+u+'" target="_blank" rel="noopener">تيليجرام</a></div></div>';
 }).join('');
 return '<section class="hero"><h1>تواصل مع المنسقة</h1><p>الاشتراك والاستفسار يتم بشكل خاص ومباشر على تيليجرام مع منسقة بلدك برسالة جاهزة.</p></section>'+
 '<h2>الخطوات</h2><div class="panel"><ol class="steps"><li>اختر منسقة بلدك من القائمة أدناه.</li><li>اضغط «تيليجرام» وسيتم فتح المحادثة مباشرة مع تفاصيل العرض وسعره.</li><li>تجاوبك المنسقة على استفسارك وتؤكد اشتراكك.</li><li>بعد تأكيد الاشتراك يظهر العرض في «اشتراكاتي» وتصلك روابط القروبات والتنبيهات.</li></ol></div>'+
 '<h2>المنسقات</h2>'+co+
 '<h2>بوت التنبيهات والإشعارات الفورية</h2><div class="panel"><h3>تشغيل تنبيهات التيليجرام</h3><p>لتصلك إشعارات فورية ومباشرة عند جاهزية نتيجة اختبارك وتوصيات المختص، أو تنبيهات بمواعيد إعادة الاختبارات والجلسات وروابط القروبات المشترك بها.</p><button class="btn '+(S.tg?'':'primary')+' block" data-act="tg">'+(S.tg?'✓ التنبيهات مفعلة الآن (اضغط للتعطيل)':'🔔 تشغيل التنبيهات على تيليجرام')+'</button></div>'}

function render(){
 $('#view').innerHTML={home:home,offers:offers,mine:mine,help:help}[S.tab]();
 var T=[['home','🏠','الرئيسية'],['offers','🗂️','العروض'],['mine','⭐','اشتراكاتي'],['help','💬','المنسقات']];
 $('#nav').innerHTML=T.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" data-act="goto" data-id="'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+(t[0]==='mine'&&unread()?'<i class="badge">'+unread()+'</i>':'')+'</button>'}).join('');
 if(S.tab==='home')initMq();else stopMq();
 $('#tgdot').className='dot'+(S.tg?'':' off');$('#tgtxt').textContent=S.tg?'🔔 التنبيهات: مفعلة':'🔕 التنبيهات: متوقفة';
 $('#userGreeting').textContent = (CUR_USER.name || CUR_USER.u);
}

function openSheet(id,hl){
 var o=get(id),R=REV[id]||[];S.rate=0;
 var revs=R.length?R.map(function(r){return '<div class="rev"><span class="star">'+'★'.repeat(r.s)+'</span> <b>'+esc(r.n)+'</b><br><small>'+esc(r.t)+'</small></div>'}).join(''):'<p class="desc">لا توجد تقييمات بعد. كن أول من يقيّم.</p>';
 var isSub = subbed(id);
 var ctaSub=isSub?'<span class="pill ok">أنت مشترك في هذا العرض ✓</span>':'<button class="btn primary block" data-act="subscribe" data-id="'+id+'">استفسر أو اشترك عبر المنسقة</button>';

 var catName = CATS[o.cat] ? CATS[o.cat].n : o.cat;
 var subTypeBadge = o.subType ? ('<span class="tag" style="border-color:rgba(45,212,255,.4);margin-inline-start:4px">'+o.subType+'</span>') : '';
 var seatsBadge = o.seats ? ('<span class="pill" style="border-color:rgba(45,212,255,.35);background:rgba(45,212,255,.08)">💺 '+esc(o.seats)+'</span>') : '';
 var groupBadge = o.hasGroup ? ('<span class="pill" style="border-color:rgba(79,139,255,.35)">👥 قروب تفاعلي: '+(o.groupName||'متاح')+'</span>') : '<span class="pill" style="opacity:.75">👤 فردي خاص بدون قروب</span>';

 var coordBtns = COORD.map(function(c){
   var link = window.MiniAppDB ? window.MiniAppDB.buildCoordTelegramUrl(c.u, o.t, catName, o.p) : ('https://t.me/'+c.u.replace('@',''));
   return '<a class="btn sm primary" href="'+link+'" target="_blank" rel="noopener" style="flex:1;min-width:130px">'+c.f+' '+c.n+'</a>';
 }).join('');

 var rateSection = '';
 if(!isSub){
   rateSection = '<h2 id="rv-form-title">قيّم هذا العرض</h2>'+
     '<div class="note" style="border-color:var(--amber);background:rgba(251,191,36,.12);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;align-items:flex-start;gap:12px">'+
       '<span style="font-size:22px">🔒</span>'+
       '<div><b style="color:var(--amber);font-size:14px">أنت غير مشترك في هذا العرض</b>'+
       '<p style="margin:4px 0 0;font-size:13px;color:var(--muted)">لا يمكنك كتابة تقييم؛ التقييم متاح فقط للأعضاء المشتركين بعد تجربة العرض. بمجرد اشتراكك ستجد نموذج التقييم مفتوحاً هنا.</p></div>'+
     '</div>';
 } else {
   rateSection = '<div id="rateContainer">'+
     '<div id="rateFormBox">'+
       '<h2 id="rv-form-title">قيّم العرض</h2>'+
       '<div class="stars" id="stars">'+[1,2,3,4,5].map(function(n){return '<button data-act="star" data-id="'+n+'" aria-label="'+n+' نجوم">★</button>'}).join('')+'</div>'+
       '<textarea id="rtxt" placeholder="رأيك وتقييمك حول تجربتك في هذا العرض (يظهر للجميع بعد مراجعة الإدارة)..."></textarea>'+
       '<button class="btn block primary" data-act="pub" data-id="'+id+'">نشر التقييم</button>'+
     '</div>'+
     '<div id="ratePendingBox" style="display:none;padding:16px;border-radius:14px;border:1px solid rgba(34,197,94,.5);background:rgba(34,197,94,.12);text-align:center;margin:12px 0">'+
       '<div style="font-size:26px;color:var(--green);margin-bottom:4px">✓</div>'+
       '<b style="color:var(--green);font-size:15px">تقييمك بانتظار المراجعة من الإدارة...</b>'+
       '<p style="margin:6px 0 0;font-size:13px;color:var(--muted)">شكراً لمشاركتك! تم استلام تقييمك وسيظهر لجميع العملاء فور اعتماده من الأدمن.</p>'+
     '</div>'+
   '</div>';
 }

 $('#sheet').innerHTML='<div class="grab"></div>'+
 '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><span class="tag">'+catName+'</span>'+subTypeBadge+'</div>'+
 '<h2 style="margin:8px 0 4px">'+o.t+'</h2><p class="desc">'+o.d+'</p>'+
 '<div class="meta"><span class="pill">'+o.m+'</span><span class="pill price">السعر: '+o.p+'</span>'+seatsBadge+groupBadge+avg(id)+'</div>'+
 '<h2>ماذا يشمل؟</h2><ul style="margin:0;padding-inline-start:20px;color:var(--muted)">'+o.pts.map(function(p){return '<li>'+p+'</li>'}).join('')+'</ul>'+
 '<div style="margin:14px 0">'+ctaSub+'</div>'+
 '<div style="margin:12px 0">'+
   '<h3 style="font-size:14px;margin:0 0 6px">💬 التواصل المباشر مع المنسقات بالرسالة الجاهزة:</h3>'+
   '<div style="display:flex;flex-wrap:wrap;gap:6px">'+coordBtns+'</div>'+
 '</div>'+
 '<h2 id="rv">آراء المشتركين</h2>'+revs+
 rateSection+
 '<h2>ملاحظة خاصة للمختص</h2><p class="desc">لا تظهر لأحد غيره.</p><textarea id="ftxt" placeholder="اكتب ملاحظتك أو استفسارك السري"></textarea><button class="btn block" data-act="fb" data-id="'+id+'">إرسال الملاحظة للمختص</button>';
 $('#ov').classList.add('show');$('#sheet').scrollTop=0;
 if(hl){var r=$('#rv');if(r)r.scrollIntoView()}
}
function closeSheet(){$('#ov').classList.remove('show')}

function act(el){
 var a=el.dataset.act,id=el.dataset.id;
 if(a==='open')openSheet(id,el.dataset.hl);
 else if(a==='goto'){closeSheet();var p=id.split(':');S.tab=p[0];if(p[1])S.sub=p[1];render();scrollTo(0,0)}
 else if(a==='cat'){S.cat=id;S.coachType='all';S.tab='offers';render();scrollTo(0,0)}
 else if(a==='coachType'){S.coachType=id;render()}
 else if(a==='subFilter'){S.subFilter=id;render()}
 else if(a==='sub'){S.sub=id;render()}
 else if(a==='ack'){
   NOTES[+id].ack=true;
   if(window.MiniAppDB){
     var db=window.MiniAppDB.load();
     if(db.notes && db.notes[CUR_USER.u] && db.notes[CUR_USER.u][+id]) {
       db.notes[CUR_USER.u][+id].ack = true;
       window.MiniAppDB.save(db);
     }
   }
   toast('تم تأكيد قراءة الملاحظة ✓');render()}
 else if(a==='remind'){if(!S.tg){toast('فعّل التنبيهات أولاً لتصلك التذكيرات');S.tab='help';render();return}S.remind=!S.remind;toast(S.remind?'تم تفعيل التذكير':'تم إيقاف التذكير');render()}
 else if(a==='tg'){S.tg=!S.tg;if(!S.tg)S.remind=false;toast(S.tg?'تم تشغيل تنبيهات تيليجرام بنجاح 🔔':'تم إيقاف التنبيهات 🔕');render()}
 else if(a==='subscribe'){closeSheet();S.tab='help';S.pick=0;render();scrollTo(0,0);toast('اختر منسقة بلدك وسيتم فتح محادثة تيليجرام')}
 else if(a==='star'){S.rate=+id;[].forEach.call(document.querySelectorAll('#stars button'),function(b,i){b.classList.toggle('on',i<S.rate)})}
 else if(a==='pub'){
   var t=$('#rtxt')?$('#rtxt').value.trim():'';
   if(!S.rate){toast('اختر عدد النجوم أولاً');return}
   if(window.MiniAppDB){
     var db=window.MiniAppDB.load();
     db.pendingReviews = db.pendingReviews || [];
     db.pendingReviews.unshift({id:Date.now(), c:CUR_USER.name, u:CUR_USER.u, o:id, s:S.rate, t:t||'—'});
     window.MiniAppDB.save(db);
   }
   toast('«تقييمك بانتظار المراجعة من الأدمن»');
   var formBox = $('#rateFormBox');
   var pendingBox = $('#ratePendingBox');
   if(formBox && pendingBox){
     formBox.classList.remove('fade-in');
     formBox.classList.add('fade-out');
     setTimeout(function(){
       formBox.style.display = 'none';
       pendingBox.style.display = 'block';
       pendingBox.classList.remove('fade-out');
       pendingBox.classList.add('fade-in');
     }, 300);

     setTimeout(function(){
       if($('#rtxt')) $('#rtxt').value = '';
       S.rate = 0;
       var starBtns = document.querySelectorAll('#stars button');
       if(starBtns) [].forEach.call(starBtns, function(b){ b.classList.remove('on'); });
       pendingBox.classList.remove('fade-in');
       pendingBox.classList.add('fade-out');
       setTimeout(function(){
         pendingBox.style.display = 'none';
         pendingBox.classList.remove('fade-out');
         formBox.style.display = 'block';
         formBox.classList.remove('fade-out');
         formBox.classList.add('fade-in');
       }, 300);
     }, 4000);
   }
 }
 else if(a==='fb'){
   if(!$('#ftxt').value.trim()){toast('اكتب ملاحظتك أولاً');return}
   if(window.MiniAppDB){
     var db=window.MiniAppDB.load();
     db.privNotes = db.privNotes || [];
     db.privNotes.unshift({id:Date.now(), c:CUR_USER.name, u:CUR_USER.u, o:id, t:$('#ftxt').value.trim(), read:false});
     window.MiniAppDB.save(db);
   }
   $('#ftxt').value='';
   toast('وصلت ملاحظتك الخاصة للمختص بنجاح');
   closeSheet();
 }
 else if(a==='mq'){S.paused=!S.paused;mq.idle=0;$('#mqb').textContent=S.paused?'▶ تشغيل':'⏸ إيقاف'}
 else if(a==='theme'){setTheme(document.documentElement.dataset.theme==='light'?'dark':'light')}
}
function setTheme(m){document.documentElement.dataset.theme=m;$('#thl').textContent=m==='light'?'فاتح':'دارك';try{localStorage.setItem('theme',m)}catch(e){}}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&!(el.tagName==='A')){act(el)}else if(e.target.id==='ov')closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.matches('article[data-act]'))act(e.target)});
var saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
render();
</script>
</body>
</html>
