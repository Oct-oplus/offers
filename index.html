<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عروضي – ميني آب العروض والاشتراكات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--panel:#0F1A2B;--cardA:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.02);--stroke:rgba(255,255,255,.12);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.70);--blue:#2DD4FF;--blue2:#4F8BFF;--green:#22C55E;--amber:#FBBF24;--fill:rgba(255,255,255,.06);--shadow:0 18px 55px rgba(0,0,0,.45);--navbg:rgba(15,26,43,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F3F6FB;--panel:#FFFFFF;--cardA:rgba(0,0,0,.04);--cardB:rgba(0,0,0,.02);--stroke:rgba(0,0,0,.10);--text:rgba(10,16,24,.92);--muted:rgba(10,16,24,.65);--fill:rgba(0,0,0,.04);--shadow:0 18px 55px rgba(0,0,0,.16);--navbg:rgba(255,255,255,.94);--amber:#D97706}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 600px at 85% -10%,rgba(45,212,255,.22),transparent 55%),radial-gradient(700px 500px at 5% 0%,rgba(34,197,94,.16),transparent 60%),var(--bg);background-color:var(--bg);line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:12px 14px 100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top b{font-size:20px}
.chip,.toggle{border:1px solid var(--stroke);background:var(--fill);border-radius:999px;padding:8px 12px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:99px;background:linear-gradient(180deg,var(--blue),var(--green))}
.dot.off{background:var(--muted);opacity:.5}
h2{font-size:18px;margin:22px 0 10px}
.hero{border:1px solid var(--stroke);background:linear-gradient(135deg,rgba(79,139,255,.16),rgba(34,197,94,.10));border-radius:22px;padding:18px}
.hero h1{margin:0 0 4px;font-size:24px}
.hero p{margin:0;color:var(--muted)}
.carousel{margin:0 -14px;overflow-x:auto;padding:4px 0;scrollbar-width:none;cursor:grab}
.carousel::-webkit-scrollbar{display:none}
.carousel.drag{cursor:grabbing;user-select:none}
.track{display:flex;width:max-content}
.track .card{width:265px;margin-inline-end:12px;flex:none}
.card{position:relative;overflow:hidden;border:1px solid var(--stroke);border-radius:18px;padding:14px;background:linear-gradient(180deg,var(--cardA),var(--cardB));margin-bottom:12px;cursor:pointer;transition:border-color .2s}
.card:hover{border-color:rgba(45,212,255,.55)}
.glow{position:absolute;inset:-70px -70px auto auto;width:180px;height:180px;background:radial-gradient(circle at 30% 30%,rgba(45,212,255,.25),transparent 60%),radial-gradient(circle at 70% 60%,rgba(34,197,94,.18),transparent 62%);pointer-events:none}
.card>*{position:relative}
.tag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--stroke);background:var(--fill);color:var(--muted)}
.card h3{margin:8px 0 2px;font-size:17px}
.desc{margin:0 0 8px;color:var(--muted);font-size:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--stroke);background:var(--fill)}
.price{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12);font-weight:700}
.star{color:var(--amber);font-size:13px}
.ok{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:16px;padding:14px;text-align:right}
.cat span{font-size:22px;display:block}
.cat small{color:var(--muted)}
.btn{border:1px solid var(--stroke);background:var(--fill);border-radius:12px;padding:11px 14px;font-size:14px;text-decoration:none;color:var(--text);display:inline-flex;justify-content:center;align-items:center;gap:6px}
.btn.primary{border-color:rgba(45,212,255,.7);background:rgba(45,212,255,.14)}
.btn.block{width:100%}
.panel{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:18px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel p{margin:0 0 8px;color:var(--muted);font-size:14px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin:8px 0;color:var(--muted);font-size:14px}
.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:rgba(45,212,255,.15);color:var(--blue);font-weight:700;font-size:13px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.seg button{flex:none;border:1px solid var(--stroke);background:var(--fill);border-radius:99px;padding:8px 14px;font-size:14px}
.seg button.on{border-color:rgba(45,212,255,.7);background:rgba(45,212,255,.14);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--navbg);border-top:1px solid var(--stroke);backdrop-filter:blur(12px);z-index:5}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--muted);position:relative}
.nav button span{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--blue);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.ov.show{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;max-height:88%;overflow-y:auto;background:var(--panel);border:1px solid var(--stroke);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--stroke);margin:0 auto 10px}
.rev{border-top:1px solid var(--stroke);padding:10px 0;font-size:14px}
.rev small{color:var(--muted)}
.stars button{border:0;background:none;font-size:28px;color:var(--muted);padding:0 2px}
.stars button.on{color:var(--amber)}
textarea,.in{width:100%;font:inherit;color:var(--text);background:var(--fill);border:1px solid var(--stroke);border-radius:12px;padding:10px;margin:6px 0}
textarea{min-height:70px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;display:none;box-shadow:var(--shadow)}
.co{display:flex;align-items:center;gap:12px}
.co .fl{font-size:28px}
.co>div{flex:1}
.co small{color:var(--muted)}
.hl{border-color:rgba(45,212,255,.8)}
.quick-users{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.quick-users button{border:1px solid var(--stroke);background:var(--fill);border-radius:99px;padding:5px 10px;font-size:12px}
.lbl{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <b>عروضي</b>
    <div class="row" style="gap:8px">
      <button class="chip" id="loginTopBtn" data-act="openLogin">
        <span class="dot off" id="userDot"></span>
        <span id="userTxt">تسجيل الدخول 🔑</span>
      </button>
      <button class="toggle" data-act="theme" aria-label="تبديل الوضع"><span class="dot"></span><span id="thl">دارك</span></button>
    </div>
  </div>
  <main id="view"></main>
</div>

<nav class="nav"><div id="nav"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="app-data.js"></script>
<script>
var DB = window.MiniAppDB ? window.MiniAppDB.load() : { cats:{}, offers:[], reviews:{}, coord:[] };
var CATS = DB.cats;
var OFFERS = DB.offers;
var REV = DB.reviews;
var COORD = DB.coord;

var S = {
  tab: 'home',
  cat: 'all',
  coachType: 'all',
  rate: 0,
  pick: null,
  paused: matchMedia('(prefers-reduced-motion: reduce)').matches
};

var mq = { raf:0, pos:0, hold:false, hov:false, idle:0, last:0, prog:false, down:false, moved:false };
function stopMq(){ cancelAnimationFrame(mq.raf); mq.raf=0; }
function initMq(){
  stopMq(); var el=$('#mq'); if(!el) return;
  var now = function(){ return performance.now(); };
  mq.pos = mq.pos || el.scrollWidth/2; el.scrollLeft = -mq.pos; mq.prog = true; mq.last = 0;
  function tick(t){
    var half=el.scrollWidth/2, max=el.scrollWidth-el.clientWidth, dt=Math.min(50, t-(mq.last||t));
    mq.last = t;
    var auto = !S.paused && !mq.hold && !mq.hov && t > mq.idle, wrote = false;
    if(auto){ mq.pos += 0.035 * dt; wrote = true; } else mq.pos = Math.abs(el.scrollLeft);
    if(mq.pos > max - 2){ mq.pos -= half; wrote = true; }
    if(mq.pos < 1){ mq.pos += half; wrote = true; }
    if(wrote){ mq.prog = true; el.scrollLeft = -mq.pos; }
    mq.raf = requestAnimationFrame(tick);
  }
  el.addEventListener('scroll', function(){ if(mq.prog){ mq.prog=false; return; } mq.idle = now()+2500; });
  el.addEventListener('pointerenter', function(e){ if(e.pointerType==='mouse') mq.hov = true; });
  el.addEventListener('pointerleave', function(e){ if(e.pointerType==='mouse'){ mq.hov = false; mq.idle = now()+800; } });
  el.addEventListener('pointerdown', function(e){
    mq.hold = true; mq.moved = false;
    if(e.pointerType==='mouse'){ mq.down = true; mq.sx = e.clientX; mq.ss = el.scrollLeft; }
  });
  el.addEventListener('pointermove', function(e){
    if(!mq.down) return;
    var dx = e.clientX - mq.sx;
    if(Math.abs(dx) > 5 && !mq.moved){ mq.moved = true; el.setPointerCapture(e.pointerId); el.classList.add('drag'); }
    if(mq.moved) el.scrollLeft = mq.ss - dx;
  });
  function end(){ mq.down = false; mq.hold = false; el.classList.remove('drag'); mq.idle = now()+2500; }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', function(e){ if(mq.moved){ e.stopPropagation(); e.preventDefault(); mq.moved = false; } }, true);
  mq.raf = requestAnimationFrame(tick);
}

var $ = function(s){ return document.querySelector(s); };
function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function get(id){ return OFFERS.filter(function(o){ return o.id===id; })[0]; }
function avg(id){
  var r = REV[id] || [];
  if(!r.length) return '';
  var a = r.reduce(function(x,y){ return x+y.s; }, 0) / r.length;
  return '<span class="star">★ '+a.toFixed(1)+'</span> <small>('+r.length+')</small>';
}

function toast(m){
  var t = $('#toast');
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(function(){ t.style.display='none'; }, 2800);
}

function card(o){
  var catName = CATS[o.cat] ? CATS[o.cat].n : o.cat;
  var subTypeBadge = o.subType ? ('<span class="tag" style="border-color:rgba(45,212,255,.4);margin-inline-start:4px">'+o.subType+'</span>') : '';
  var seatsBadge = o.seats ? ('<span class="pill" style="border-color:rgba(45,212,255,.35);background:rgba(45,212,255,.08)">💺 '+esc(o.seats)+'</span>') : '';
  var grpBadge = o.hasGroup ? '<span class="pill ok">مربوط بقروب 👥</span>' : '<span class="pill" style="opacity:.75">👤 فردي</span>';
  return '<article class="card" tabindex="0" data-act="open" data-id="'+o.id+'">'+
    '<div class="glow"></div>'+
    '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><span class="tag">'+catName+'</span>'+subTypeBadge+'</div>'+
    '<h3>'+esc(o.t)+'</h3>'+
    '<p class="desc">'+esc(o.d)+'</p>'+
    '<div class="meta">'+
      '<span class="pill">'+esc(o.m)+'</span>'+
      '<span class="pill price">السعر: '+esc(o.p)+'</span>'+
      seatsBadge+
      grpBadge+
      avg(o.id)+
    '</div>'+
  '</article>';
}

function home(){
  var feat = OFFERS.filter(function(o){ return o.vis && o.feat; }).map(card).join('');
  if(!feat) feat = OFFERS.filter(function(o){ return o.vis; }).slice(0, 4).map(card).join('');
  var cats = Object.keys(CATS).map(function(k){
    var n = OFFERS.filter(function(o){ return o.cat===k && o.vis; }).length;
    return '<button class="cat" data-act="cat" data-id="'+k+'"><span>'+CATS[k].i+'</span><b>'+CATS[k].n+'</b><br><small>'+n+' عروض</small></button>';
  }).join('');

  return '<section class="hero">'+
    '<h1>أهلاً بك في ميني آب العروض 👋</h1>'+
    '<p>تصفّح العروض السنوية، الكورسات، الجلسات، والاختبارات المعتمدة وقيمها بكل سهولة.</p>'+
  '</section>'+
  '<div class="row"><h2>العروض السنوية</h2><button class="chip" id="mqb" data-act="mq">'+(S.paused?'▶ تشغيل':'⏸ إيقاف')+'</button></div>'+
  '<p class="desc" style="margin:-4px 0 6px;font-size:12px">اسحب البطاقات بإصبعك لتحريكها، أو اضغط على أي عرض لمعرفة التفاصيل.</p>'+
  '<div class="carousel" id="mq"><div class="track">'+feat+'<span aria-hidden="true" style="display:contents">'+feat.replace(/tabindex="0"/g,'tabindex="-1"')+'</span></div></div>'+
  '<h2>تصفّح حسب الفئة</h2><div class="cats">'+cats+'</div>'+
  '<h2>كيف أشترك؟</h2><div class="panel">'+
    '<ol class="steps">'+
      '<li>اختر العرض الذي يناسبك واقرأ تفاصيله وسعره.</li>'+
      '<li>اضغط زر الاستفسار وتواصل مع منسقة بلدك على تيليجرام برسالة جاهزة.</li>'+
      '<li>سجّل دخولك باليوزرنيم وكلمة السر (1234) لمتابعة اشتراكاتك ونتائجك والتذكيرات.</li>'+
    '</ol>'+
    '<button class="btn primary block" data-act="goto" data-id="help">تواصل مع المنسقة الآن</button>'+
  '</div>';
}

function offers(){
  var seg = ['all'].concat(Object.keys(CATS)).map(function(k){
    return '<button class="'+(S.cat===k?'on':'')+'" data-act="cat" data-id="'+k+'">'+(k==='all'?'الكل':CATS[k].n)+'</button>';
  }).join('');

  var coachSubRow = '';
  if(S.cat === 'coach'){
    var coachTypes = [
      ['all','كل الكوتشينغ'],
      ['فردي','فردي (مقعد خاص)'],
      ['جماعي','جماعي (قروب)'],
      ['باكج','باكج مجمّع']
    ];
    coachSubRow = '<div class="sub-filters" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px">'+
      coachTypes.map(function(ct){
        return '<button class="'+(S.coachType===ct[0]?'on':'')+'" data-act="coachType" data-id="'+ct[0]+'" style="flex:none;border:1px solid var(--stroke);background:var(--fill);border-radius:99px;padding:6px 13px;font-size:13px;color:var(--muted);cursor:pointer">'+ct[1]+'</button>';
      }).join('')+
    '</div>';
  }

  var filtered = OFFERS.filter(function(o){
    if(!o.vis) return false;
    if(S.cat !== 'all' && o.cat !== S.cat) return false;
    if(S.cat === 'coach' && S.coachType !== 'all' && o.subType !== S.coachType) return false;
    return true;
  });

  var list = filtered.length ? filtered.map(card).join('') : '<div class="panel" style="text-align:center;padding:24px"><p class="desc" style="margin:0">لا توجد عروض في هذه الفئة حالياً.</p></div>';

  return '<div class="seg">'+seg+'</div>' + coachSubRow + list;
}

function minePrompt(){
  return '<section class="hero"><h1>اشتراكاتي ⭐</h1><p>هذه المساحة مخصصة للعملاء المسجلين لمتابعة عروضهم وجلساتهم واختباراتهم.</p></section>'+
  '<div class="panel" style="margin-top:16px;text-align:center;padding:24px 16px">'+
    '<span style="font-size:42px">🔒</span>'+
    '<h3 style="margin:12px 0 6px">يجب تسجيل الدخول أولاً</h3>'+
    '<p style="color:var(--muted);font-size:14px;margin-bottom:16px">لعرض اشتراكاتك وملاحظات المختص ونتائج اختباراتك، سجّل دخولك باليوزرنيم والرقم السري (1234).</p>'+
    '<button class="btn primary block" data-act="openLogin">تسجيل الدخول الآن 🔑</button>'+
  '</div>';
}

function help(){
  var co = COORD.map(function(c, i){
    var u = 'https://t.me/' + c.u.replace('@','');
    return '<div class="panel'+(S.pick===i?' hl':'')+'"><div class="co"><span class="fl">'+c.f+'</span><div><b>'+c.n+'</b><br><small>'+c.h+'</small></div><a class="btn primary" href="'+u+'" target="_blank" rel="noopener">تيليجرام</a></div></div>';
  }).join('');
  return '<section class="hero"><h1>تواصل مع المنسقة</h1><p>الاشتراك والاستفسار يتم بشكل مباشر على تيليجرام مع منسقة دولتك برسالة جاهزة ومحددة.</p></section>'+
  '<h2>قائمة المنسقات</h2>'+co+
  '<h2>ملاحظة</h2><div class="panel"><p>بعد تأكيد الاشتراك مع المنسقة، يتم تسجيل حسابك ويظهر العرض في صفحة اشتراكاتك فور تسجيل الدخول.</p></div>';
}

function render(){
  var viewEl = $('#view');
  if(S.tab === 'home') viewEl.innerHTML = home();
  else if(S.tab === 'offers') viewEl.innerHTML = offers();
  else if(S.tab === 'mine') viewEl.innerHTML = minePrompt();
  else if(S.tab === 'help') viewEl.innerHTML = help();

  var T = [['home','🏠','الرئيسية'],['offers','🗂️','العروض'],['mine','⭐','اشتراكاتي'],['help','💬','المنسقات']];
  $('#nav').innerHTML = T.map(function(t){
    return '<button class="'+(S.tab===t[0]?'on':'')+'" data-act="goto" data-id="'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+'</button>';
  }).join('');

  if(S.tab === 'home') initMq(); else stopMq();

  var cur = window.MiniAppDB ? window.MiniAppDB.getCurrentUser() : null;
  if(cur){
    $('#userDot').className = 'dot';
    $('#userTxt').textContent = cur.name || cur.u;
  } else {
    $('#userDot').className = 'dot off';
    $('#userTxt').textContent = 'تسجيل الدخول 🔑';
  }
}

function openSheet(id, hl){
  var o = get(id), R = REV[id] || []; S.rate = 0;
  var catName = CATS[o.cat] ? CATS[o.cat].n : o.cat;
  var revs = R.length ? R.map(function(r){
    return '<div class="rev"><span class="star">'+'★'.repeat(r.s)+'</span> <b>'+esc(r.n)+'</b><br><small>'+esc(r.t)+'</small></div>';
  }).join('') : '<p class="desc">لا توجد تقييمات بعد. كن أول من يقيّم هذا العرض بعد تسجيل الدخول.</p>';

  // أزرار المنسقات حسب كل دولة مع رسالة الاستفسار الجاهزة كما في شرح.txt
  var coordBtns = COORD.map(function(c){
    var link = window.MiniAppDB.buildCoordTelegramUrl(c.u, o.t, catName, o.p);
    return '<a class="btn primary sm" href="'+link+'" target="_blank" rel="noopener" style="flex:1;min-width:130px">'+c.f+' '+c.n+'</a>';
  }).join('');

  var groupInfo = o.hasGroup ?
    '<div class="panel" style="margin-top:10px"><b>👥 قروب العرض: '+esc(o.groupName||'قروب المشتركين')+'</b><br><small class="lbl">حالة البوت: '+(o.botLinked?'مربوط بالقروب وتصلك الروابط مباشرة ✓':'بانتظار ربط البوت')+'</small></div>' :
    '<div class="panel" style="margin-top:10px"><small class="lbl">ℹ️ هذا العرض فردي / مباشر ولا يرتبط بقروب جماعي.</small></div>';

  $('#sheet').innerHTML = '<div class="grab"></div>'+
    '<span class="tag">'+catName+'</span>'+
    '<h2 style="margin:8px 0 4px">'+esc(o.t)+'</h2>'+
    '<p class="desc">'+esc(o.d)+'</p>'+
    '<div class="meta">'+
      '<span class="pill">'+esc(o.m)+'</span>'+
      '<span class="pill price">السعر: '+esc(o.p)+'</span>'+
      avg(id)+
    '</div>'+
    groupInfo+
    '<h2>ماذا يشمل؟</h2>'+
    '<ul style="margin:0;padding-inline-start:20px;color:var(--muted)">'+
      (o.pts||[]).map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+
    '</ul>'+
    '<div style="margin:16px 0">'+
      '<h3 style="font-size:15px;margin:0 0 8px">💬 استفسار أو اشتراك مباشر:</h3>'+
      '<p class="desc" style="font-size:13px">اختر منسقة دولتك للانتقال لمحادثة تيليجرام مع رسالة تفاصيل العرض الجاهزة:</p>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px">'+coordBtns+'</div>'+
    '</div>'+
    '<h2 id="rv">آراء وتقييمات المشتركين</h2>'+revs+
    '<h2>قيّم العرض</h2>'+
    '<p class="desc">شاركنا رأيك ليستفيد منه الآخرون (يلزم تسجيل الدخول).</p>'+
    '<div class="stars" id="stars">'+[1,2,3,4,5].map(function(n){
      return '<button data-act="star" data-id="'+n+'" aria-label="'+n+' نجوم">★</button>';
    }).join('')+'</div>'+
    '<textarea id="rtxt" placeholder="رأيك يظهر للجميع بعد مراجعة الأدمن"></textarea>'+
    '<button class="btn block primary" data-act="pub" data-id="'+id+'">نشر التقييم</button>'+
    '<h2>ملاحظة خاصة للمختص</h2>'+
    '<p class="desc">رسالة سرية لا تظهر لأحد غير المختص المعني.</p>'+
    '<textarea id="ftxt" placeholder="اكتب ملاحظتك أو استفسارك الخاص"></textarea>'+
    '<button class="btn block" data-act="fb" data-id="'+id+'">إرسال الملاحظة للمختص</button>';

  $('#ov').classList.add('show');
  $('#sheet').scrollTop = 0;
  if(hl){ var r=$('#rv'); if(r) r.scrollIntoView(); }
}

function openLoginSheet(){
  var cur = window.MiniAppDB.getCurrentUser();
  var loggedInHtml = '';
  if(cur){
    loggedInHtml = '<div class="panel" style="margin-bottom:14px">'+
      '<div class="row"><div><b>أنت مسجّل حالياً: '+esc(cur.name)+'</b><br><small class="lbl">'+esc(cur.u)+' · '+esc(cur.roleName)+'</small></div>'+
      '<button class="btn sm" data-act="doLogout">تسجيل الخروج</button></div>'+
      '<div style="margin-top:10px"><button class="btn primary block" data-act="goToRolePage" data-role="'+cur.role+'">الذهاب إلى واجهتك المخصصة ↵</button></div>'+
    '</div><h3 style="margin:12px 0 6px">أو تسجيل الدخول بحساب آخر:</h3>';
  }

  $('#sheet').innerHTML = '<div class="grab"></div>'+
    '<h2 style="margin:4px 0 6px">تسجيل الدخول إلى ميني آب 🔑</h2>'+
    '<p class="desc">أدخل اسم المستخدم والرقم السري للانتقال إلى الواجهة الخاصة بدورك.</p>'+
    loggedInHtml+
    '<label class="lbl" for="luser">اسم المستخدم (اليوزرنيم)</label>'+
    '<input class="in" id="luser" placeholder="مثال: @noura أو @admin أو @sa_coord" dir="ltr" value="@noura">'+
    '<label class="lbl" for="lpass">الرقم السري</label>'+
    '<input class="in" id="lpass" type="password" placeholder="1234" value="1234" dir="ltr">'+
    '<div class="quick-users">'+
      '<span class="lbl" style="width:100%;display:block;margin-bottom:2px">⚡ اضغط للتعبئة السريعة:</span>'+
      '<button data-act="fillUser" data-u="@noura" data-p="1234">👤 عميل (@noura)</button>'+
      '<button data-act="fillUser" data-u="@sa_coord" data-p="1234">📋 منسقة (@sa_coord)</button>'+
      '<button data-act="fillUser" data-u="@admin" data-p="1234">⚡ أدمن (@admin)</button>'+
    '</div>'+
    '<button class="btn primary block" data-act="doLogin">تسجيل الدخول 🚀</button>';

  $('#ov').classList.add('show');
  $('#sheet').scrollTop = 0;
}

function closeSheet(){ $('#ov').classList.remove('show'); }

function resolveRole(u){
  var norm = u.trim().toLowerCase();
  if(norm.indexOf('admin') > -1) return { role: 'admin', roleName: 'الأدمن - مدير النظام', file: '%D9%84%D9%88%D8%AD%D8%A9%20%D8%A7%D9%84%D8%A7%D9%94%D8%AF%D9%85%D9%86.html' };
  if(norm.indexOf('coord') > -1 || norm === '@coord_sa' || norm === '@sa_coord' || norm === '@kw_coord' || norm === '@ae_coord' || norm === '@qa_coord') {
    return { role: 'coord', roleName: 'المنسقة', file: '%D9%88%D8%A7%D8%AC%D9%87%D8%A9%20%D8%A7%D9%84%D9%85%D9%86%D8%B3%D9%82%D8%A9.html' };
  }
  return { role: 'client', roleName: 'عميل', file: '%D8%B9%D8%B1%D9%88%D8%B6%D9%8A%20%E2%80%93%20%D9%88%D8%A7%D8%AC%D9%87%D8%A9%20%D8%A7%D9%84%D8%B9%D9%85%D9%8A%D9%84.html' };
}

function act(el){
  var a = el.dataset.act, id = el.dataset.id;
  if(a === 'open') openSheet(id, el.dataset.hl);
  else if(a === 'openLogin') openLoginSheet();
  else if(a === 'goto'){ closeSheet(); S.tab = id; render(); scrollTo(0,0); }
  else if(a === 'cat'){ S.cat = id; S.coachType = 'all'; S.tab = 'offers'; render(); scrollTo(0,0); }
  else if(a === 'coachType'){ S.coachType = id; render(); }
  else if(a === 'mq'){
    S.paused = !S.paused; mq.idle = 0;
    $('#mqb').textContent = S.paused ? '▶ تشغيل' : '⏸ إيقاف';
  }
  else if(a === 'star'){
    S.rate = +id;
    [].forEach.call(document.querySelectorAll('#stars button'), function(b, i){
      b.classList.toggle('on', i < S.rate);
    });
  }
  else if(a === 'pub'){
    var cur = window.MiniAppDB ? window.MiniAppDB.getCurrentUser() : null;
    if(!cur){
      toast('⚠️ يجب تسجيل الدخول أولاً لنشر التقييم');
      openLoginSheet();
      return;
    }
    if(!S.rate){ toast('اختر عدد النجوم أولاً'); return; }
    var t = $('#rtxt').value.trim();
    // إضافة التقييم إلى قائمة بانتظار مراجعة الأدمن كما هو مطلوب في شرح.txt
    var db = window.MiniAppDB.load();
    db.pendingReviews = db.pendingReviews || [];
    db.pendingReviews.unshift({
      id: Date.now(),
      c: cur.name || cur.u,
      u: cur.u,
      o: id,
      s: S.rate,
      t: t || 'بدون تعليق مكتوب'
    });
    window.MiniAppDB.save(db);
    toast('✅ تقييمك بانتظار المراجعة من الأدمن قبل النشر');
    closeSheet();
  }
  else if(a === 'fb'){
    var cur = window.MiniAppDB ? window.MiniAppDB.getCurrentUser() : null;
    if(!cur){
      toast('⚠️ يجب تسجيل الدخول أولاً لإرسال ملاحظة للمختص');
      openLoginSheet();
      return;
    }
    var ftxt = $('#ftxt').value.trim();
    if(!ftxt){ toast('اكتب ملاحظتك أولاً'); return; }
    var db = window.MiniAppDB.load();
    db.privNotes = db.privNotes || [];
    db.privNotes.unshift({
      id: Date.now(),
      c: cur.name || cur.u,
      u: cur.u,
      o: id,
      t: ftxt,
      read: false
    });
    window.MiniAppDB.save(db);
    toast('✅ وصلت ملاحظتك السرية للمختص');
    closeSheet();
  }
  else if(a === 'fillUser'){
    $('#luser').value = el.dataset.u;
    $('#lpass').value = el.dataset.p;
  }
  else if(a === 'doLogin'){
    var u = $('#luser').value.trim();
    var p = $('#lpass').value.trim();
    if(!u){ toast('أدخل اسم المستخدم أولاً'); return; }
    if(p !== '1234'){
      toast('❌ الرقم السري غير صحيح (المطلوب: 1234)');
      return;
    }
    if(u[0] !== '@') u = '@' + u;
    var info = resolveRole(u);
    var userObj = {
      u: u,
      role: info.role,
      roleName: info.roleName,
      name: u === '@noura' ? 'نورة ع.' : (u === '@admin' ? 'المدير العام' : (u.indexOf('coord')>-1 ? 'سارة (منسقة)' : u))
    };
    window.MiniAppDB.setCurrentUser(userObj);
    toast('تم تسجيل الدخول بنجاح! جاري الانتقال...');
    setTimeout(function(){
      window.location.href = info.file;
    }, 450);
  }
  else if(a === 'doLogout'){
    window.MiniAppDB.setCurrentUser(null);
    toast('تم تسجيل الخروج');
    closeSheet();
    render();
  }
  else if(a === 'goToRolePage'){
    var cur = window.MiniAppDB.getCurrentUser();
    if(cur){
      var info = resolveRole(cur.u);
      window.location.href = info.file;
    }
  }
  else if(a === 'theme'){
    setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  }
}

function setTheme(m){
  document.documentElement.dataset.theme = m;
  $('#thl').textContent = m === 'light' ? 'فاتح' : 'دارك';
  try { localStorage.setItem('theme', m); } catch(e){}
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(el && el.tagName !== 'A') act(el);
  else if(e.target.id === 'ov') closeSheet();
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeSheet();
  if(e.key === 'Enter' && e.target.matches('article[data-act]')) act(e.target);
});

var saved = null;
try { saved = localStorage.getItem('theme'); } catch(e){}
setTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
render();
</script>
</body>
</html>
