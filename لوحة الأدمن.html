<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--panel:#0F1A2B;--cardA:rgba(255,255,255,.06);--cardB:rgba(255,255,255,.02);--stroke:rgba(255,255,255,.12);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.70);--blue:#2DD4FF;--blue2:#4F8BFF;--green:#22C55E;--amber:#FBBF24;--fill:rgba(255,255,255,.06);--shadow:0 18px 55px rgba(0,0,0,.45);--navbg:rgba(15,26,43,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F3F6FB;--panel:#FFFFFF;--cardA:rgba(0,0,0,.04);--cardB:rgba(0,0,0,.02);--stroke:rgba(0,0,0,.10);--text:rgba(10,16,24,.92);--muted:rgba(10,16,24,.65);--fill:rgba(0,0,0,.04);--shadow:0 18px 55px rgba(0,0,0,.16);--navbg:rgba(255,255,255,.94);--amber:#D97706}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 600px at 85% -10%,rgba(45,212,255,.22),transparent 55%),radial-gradient(700px 500px at 5% 0%,rgba(34,197,94,.16),transparent 60%),var(--bg);background-color:var(--bg);line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:12px 14px 100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top b{font-size:20px}
.chip,.toggle{border:1px solid var(--stroke);background:var(--fill);border-radius:999px;padding:8px 12px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:99px;background:linear-gradient(180deg,var(--blue),var(--green))}
.dot.off{background:var(--muted);opacity:.5}
h2{font-size:18px;margin:22px 0 10px}
.hero{border:1px solid var(--stroke);background:linear-gradient(135deg,rgba(79,139,255,.16),rgba(34,197,94,.10));border-radius:22px;padding:18px}
.hero h1{margin:0 0 4px;font-size:24px}
.hero p{margin:0;color:var(--muted)}
.carousel{margin:0 -14px;overflow-x:auto;padding:4px 0;scrollbar-width:none;cursor:grab}
.carousel::-webkit-scrollbar{display:none}
.carousel.drag{cursor:grabbing;user-select:none}
.track{display:flex;width:max-content}
.track .card{width:265px;margin-inline-end:12px;flex:none}
.card{position:relative;overflow:hidden;border:1px solid var(--stroke);border-radius:18px;padding:14px;background:linear-gradient(180deg,var(--cardA),var(--cardB));margin-bottom:12px;cursor:pointer}
.card:hover{border-color:rgba(45,212,255,.55)}
.glow{position:absolute;inset:-70px -70px auto auto;width:180px;height:180px;background:radial-gradient(circle at 30% 30%,rgba(45,212,255,.25),transparent 60%),radial-gradient(circle at 70% 60%,rgba(34,197,94,.18),transparent 62%);pointer-events:none}
.card>*{position:relative}
.tag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--stroke);background:var(--fill);color:var(--muted)}
.card h3{margin:8px 0 2px;font-size:17px}
.desc{margin:0 0 8px;color:var(--muted);font-size:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--stroke);background:var(--fill)}
.price{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12);font-weight:700}
.star{color:var(--amber);font-size:13px}
.ok{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.12)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:16px;padding:14px;text-align:right}
.cat span{font-size:22px;display:block}
.cat small{color:var(--muted)}
.btn{border:1px solid var(--stroke);background:var(--fill);border-radius:12px;padding:11px 14px;font-size:14px;text-decoration:none;color:var(--text);display:inline-flex;justify-content:center;align-items:center;gap:6px}
.btn.primary{border-color:rgba(45,212,255,.7);background:rgba(45,212,255,.14)}
.btn.block{width:100%}
.panel{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:18px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel p{margin:0 0 8px;color:var(--muted);font-size:14px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin:8px 0;color:var(--muted);font-size:14px}
.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:rgba(45,212,255,.15);color:var(--blue);font-weight:700;font-size:13px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.seg button{flex:none;border:1px solid var(--stroke);background:var(--fill);border-radius:99px;padding:8px 14px;font-size:14px}
.seg button.on{border-color:rgba(45,212,255,.7);background:rgba(45,212,255,.14);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
.note{border:1px solid rgba(251,191,36,.55);background:rgba(251,191,36,.10);border-radius:14px;padding:12px;margin:8px 0}
.note.done{border-color:var(--stroke);background:var(--fill);opacity:.8}
.note b{font-size:13px;color:var(--amber)}
.note.done b{color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{width:46px;height:26px;border-radius:99px;border:1px solid var(--stroke);background:var(--fill);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:99px;background:var(--muted);transition:.2s}
.sw[aria-checked=true]{background:rgba(34,197,94,.3)}
.sw[aria-checked=true]:after{inset-inline-start:22px;background:var(--green)}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--navbg);border-top:1px solid var(--stroke);backdrop-filter:blur(12px);z-index:5}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--muted);position:relative}
.nav button span{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--blue);font-weight:700}
.badge{position:absolute;top:4px;inset-inline-start:50%;margin-inline-start:6px;background:#EF4444;color:#fff;font-size:10px;border-radius:99px;min-width:16px;height:16px;line-height:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.ov.show{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;max-height:88%;overflow-y:auto;background:var(--panel);border:1px solid var(--stroke);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--stroke);margin:0 auto 10px}
.rev{border-top:1px solid var(--stroke);padding:10px 0;font-size:14px}
.rev small{color:var(--muted)}
.stars button{border:0;background:none;font-size:28px;color:var(--muted);padding:0 2px}
.stars button.on{color:var(--amber)}
textarea{width:100%;font:inherit;color:var(--text);background:var(--fill);border:1px solid var(--stroke);border-radius:12px;padding:10px;min-height:70px;margin:6px 0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;display:none}
.co{display:flex;align-items:center;gap:12px}
.co .fl{font-size:28px}
.co>div{flex:1}
.co small{color:var(--muted)}
.hl{border-color:rgba(45,212,255,.8)}
.in{width:100%;font:inherit;color:var(--text);background:var(--fill);border:1px solid var(--stroke);border-radius:12px;padding:10px;margin:6px 0}
select.in option{color:#000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--cardA),var(--cardB));border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--blue)}.stat small{color:var(--muted);font-size:12px}
.lbl{font-size:13px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.sm{padding:8px 12px;font-size:13px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{color:var(--green)!important}.dn{color:#EF4444!important}
.pill.warn{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.12)}
.dis{opacity:.5}
.plist{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto;margin:6px 0}
.po{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:right;border:1px solid var(--stroke);background:var(--fill);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text)}
.po small{color:var(--muted);font-size:12px;flex:none}
.po.on{border-color:rgba(45,212,255,.8);background:rgba(45,212,255,.14)}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--stroke);cursor:pointer}
details{margin-top:8px}summary{cursor:pointer;color:var(--blue);font-size:14px;padding:4px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <b>لوحة الأدمن</b>
    <div class="row" style="gap:6px;flex-wrap:wrap;justify-content:flex-end">
      <a class="chip" href="index.html" style="text-decoration:none" title="الرجوع للرئيسية"><span class="dot"></span><span>المدير (@admin)</span> <span style="font-size:11px;opacity:.7">خروج ↵</span></a>
      <button class="toggle" data-act="theme" aria-label="تبديل الوضع"><span class="dot"></span><span id="thl">دارك</span></button>
    </div>
  </div>
  <main id="view"></main>
</div>
<nav class="nav"><div id="nav"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="app-data.js"></script>
<script>
var DB = window.MiniAppDB ? window.MiniAppDB.load() : null;
var CATS = {coach:'كوتشينغ',course:'كورسات تطويرية',session:'جلسات نفسية',test:'اختبارات تقييم'};

var OF = (DB && DB.offers) ? DB.offers.map(function(o){
  return { id: o.id, cat: o.cat, t: o.t, p: o.p, d: o.d, vis: o.vis!==false, feat: !!o.feat, g: !!o.hasGroup, bot: !!o.botLinked, groupName: o.groupName||'', st: o.subType||'', seats: o.seats||'', maxSeats: o.maxSeats||null, m: o.m||'' };
}) : [
  ['c1','coach','كوتشينغ التواصل',false],['c2','coach','كوتشينغ البزنس',false],['c3','coach','كوتشينغ الحياة',true],
  ['k1','course','إدارة الوقت والتركيز',true],['k2','course','بناء الثقة بالنفس',true],['k3','course','مهارات القيادة',true],
  ['s1','session','جلسة القلق والضغوط',false],['s2','session','جلسة العلاقات',false],['s3','session','التعافي من الاحتراق',false],
  ['t1','test','اختبار الشخصية',false],['t2','test','اختبار القلق والتوتر',false],['t3','test','اختبار الاحتراق الوظيفي',false]
].map(function(a){return{id:a[0],cat:a[1],t:a[2],p:'00$',d:'وصف مختصر للعرض.',vis:true,feat:['c1','k1','s1','t1'].indexOf(a[0])>-1,g:a[3],bot:a[0]!=='k3',groupName:'قروب المشتركين',st:({c1:'فردي',c2:'فردي',c3:'جماعي'})[a[0]]||'',seats:'',maxSeats:null,m:''}});

var CL = [
{id:1,n:'نورة ع.',u:'@noura',f:'🇸🇦',since:'مارس 2026',subs:[{o:'c1',l:'الجلسة 3 من 6',p:50},{o:'k1',l:'4 من 10 دروس',p:40}],notes:[{t:'لا تتخطي تمرين التنفس اليومي.',ack:false,d:'قبل 3 أيام'}],tests:[{o:'t1',st:'done',res:'ميل للتحليل والتنظيم، ونقطة التطوير التفويض.'},{o:'t2',st:'wait',when:'أنجزته أمس'}]},
{id:2,n:'خالد م.',u:'@khaled',f:'🇰🇼',since:'يونيو 2026',subs:[{o:'c2',l:'الجلسة 5 من 8',p:62}],notes:[{t:'جهّز قائمة أولوياتك للجلسة القادمة.',ack:true,d:'قبل أسبوع'}],tests:[{o:'t3',st:'wait',when:'أنجزه اليوم'}]},
{id:3,n:'ريم س.',u:'@reem',f:'🇦🇪',since:'أغسطس 2026',subs:[{o:'s1',l:'الجلسة 2 من 6',p:33}],notes:[{t:'سجّلي مواقف القلق في دفتر.',ack:false,d:'قبل يوم'}],tests:[]},
{id:4,n:'سلمان ح.',u:'@salman',f:'🇸🇦',since:'يوليو 2026',subs:[{o:'k2',l:'3 من 8 دروس',p:38}],notes:[],tests:[]},
{id:5,n:'منى ق.',u:'@mona',f:'🇶🇦',since:'سبتمبر 2026',subs:[{o:'c3',l:'الجلسة 1 من 6',p:17}],notes:[],tests:[]}];

var PEND = (DB && DB.pendingReviews) || [
  {id:1,c:'نورة ع.',u:'@noura',o:'c1',s:5,t:'غيّرت طريقة كلامي مع فريقي.'},
  {id:2,c:'سلمان ح.',u:'@salman',o:'t1',s:4,t:'التفسير كان دقيق.'},
  {id:3,c:'خالد م.',u:'@khaled',o:'c2',s:5,t:'وضّح لي أهدافي.'}
];

var PRIV = (DB && DB.privNotes) || [
  {id:1,c:'ريم س.',u:'@reem',o:'s1',t:'أتمنى التذكير قبل الجلسة بساعتين.',read:false},
  {id:2,c:'منى ق.',u:'@mona',o:'c3',t:'ممكن تمارين أقصر؟',read:false}
];

var COORD = [
  ['🇸🇦','منسقة السعودية','@sa_coord',true],
  ['🇰🇼','منسقة الكويت','@kw_coord',true],
  ['🇦🇪','منسقة الإمارات','@ae_coord',true],
  ['🇶🇦','منسقة قطر','@qa_coord',false]
];

var PERMS = (DB && DB.perms) || {};
COORD.forEach(function(c){var k=c[2].replace('@','');if(!PERMS[k])PERMS[k]={add:true,edit:true,hide:false,del:false}});
var PK = [['add','إضافة العروض'],['edit','تعديل العروض'],['hide','إخفاء العروض'],['del','حذف العروض']];

var TPL = (DB && DB.templates) || [
  ['تذكير الاختبار','اقترب موعد إعادة اختبارك. جاهز تبدأ؟'],
  ['ملاحظة جديدة','وصلتك ملاحظة جديدة من المختص، افتحها واقرأها.'],
  ['تأكيد الاشتراك','تم تأكيد اشتراكك، ويظهر الآن في صفحة اشتراكاتي.'],
  ['رابط القروب','أهلاً بك! هذا رابط الانضمام للقروب الخاص بعرضك: https://t.me/+join_group']
];

var MN = ['أغسطس 2026','سبتمبر 2026','أكتوبر 2026'];
var CNT = {c1:[7,9,1],c2:[6,6,0],c3:[5,4,1],k1:[8,11,1],k2:[6,7,0],k3:[4,3,0],s1:[6,8,1],s2:[3,4,0],s3:[2,3,0],t1:[9,10,1],t2:[5,7,1],t3:[4,4,0]};
var FL = ['🇸🇦','🇸🇦','🇸🇦','🇰🇼','🇰🇼','🇦🇪','🇶🇦'];
var LOG = [], AC = [49,58,12], TD = [17,21,3];
(function(){var q=0;Object.keys(CNT).forEach(function(id){CNT[id].forEach(function(n,m){for(var j=0;j<n;j++){LOG.push({o:id,f:FL[q%7],m:m,rn:q%5===0});q++}})})})();

var RT = {c1:[4.8,23],c2:[4.6,14],c3:[4.5,9],k1:[4.7,31],k2:[4.4,18],k3:[4.2,7],s1:[4.9,19],s2:[4.6,8],s3:[4.5,6],t1:[4.7,26],t2:[4.3,15],t3:[4.4,9]};
var S = {tab:'today',coachType:'all',ccat:'all',ctype:'all',rg:{cat:'',type:'',o:''},q:'',oq:'',cat:'all',sub:'reviews',ft:'all',fc:'all',fs:'all',rp:'perf',sort:'subs',mo:1};

var $ = function(s){return document.querySelector(s)};
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function o(id){return OF.filter(function(x){return x.id===id})[0] || {t:'عرض',cat:'coach',p:'00$'}}
function cl(id){return CL.filter(function(x){return x.id==id})[0]}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}
function waits(){var r=[];CL.forEach(function(c){c.tests.forEach(function(t,i){if(t.st==='wait')r.push({c:c,i:i,t:t})})});return r}
function unread(){var r=[];CL.forEach(function(c){c.notes.forEach(function(n){if(!n.ack)r.push({c:c,n:n})})});return r}
function sw(on,act,id){return '<button class="sw" role="switch" aria-checked="'+on+'" data-act="'+act+'" data-id="'+id+'"></button>'}

var LOCALSUBS=[];
function chips(arr,cur,act){return '<div class="seg">'+arr.map(function(x){return '<button class="'+(cur===x[0]?'on':'')+'" data-act="'+act+'" data-id="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function coachTypes(){var t=['فردي','جماعي'];if(OF.some(function(x){return x.st==='باكج'}))t.push('باكج');return t}
function dbSubs(){return (window.MiniAppDB&&window.MiniAppDB.load().subs)||LOCALSUBS}
function stOf(u,id){var r=dbSubs().filter(function(s){return s.o===id&&String(s.u).toLowerCase()===String(u).toLowerCase()})[0];var x=o(id);return r?r.st:(x&&x.g?'joined':'none')}
function cByU(u){return CL.filter(function(c){return String(c.u).toLowerCase()===String(u).toLowerCase()})[0]}
(function(){dbSubs().forEach(function(s){var c=cByU(s.u);if(!c){c={id:100+CL.length,n:s.n,u:s.u,f:'🌍',since:s.d||'',subs:[],notes:[],tests:[]};CL.push(c)}if(!c.subs.some(function(x){return x.o===s.o}))c.subs.push({o:s.o,l:s.l||'',p:s.prog||0})})})();
function people(id){return CL.filter(function(c){return c.subs.some(function(s){return s.o===id})||c.tests.some(function(t){return t.o===id})})}
function waitingFor(id){var r=[];CL.forEach(function(c){c.tests.forEach(function(t,i){if(t.o===id&&t.st==='wait')r.push({c:c,i:i,t:t})})});return r}
function stBadge(st){return {joined:'<span class="pill ok">دخل القروب 🟢</span>',sent:'<span class="pill" style="border-color:var(--blue)">أُرسل الرابط 🔵</span>',pending:'<span class="pill warn">بانتظار الرابط</span>',failed:'<span class="pill warn">تعذّر الإرسال 🔴</span>'}[st]||''}
function syncDB(){
  if(!window.MiniAppDB) return;
  var db = window.MiniAppDB.load();
  db.pendingReviews = PEND; db.privNotes = PRIV; db.templates = TPL; db.perms = PERMS;
  db.offers = db.offers || [];
  OF.forEach(function(x){
    var b = db.offers.filter(function(y){return y.id===x.id})[0];
    if(!b){ b={id:x.id,pts:[],m:x.m||'',seats:x.seats||'',maxSeats:x.maxSeats||null}; db.offers.push(b); }

 '<h2>الملاحظات</h2>'+(c.notes.map(function(n){return '<div class="note'+(n.ack?' done':'')+'"><b>'+(n.ack?'✓ قرأها العميل':'⚠ لم تُقرأ بعد')+' · '+n.d+'</b><p style="margin:4px 0 0;color:var(--text)">'+esc(n.t)+'</p></div>'}).join(''))+
 '<textarea id="nt" placeholder="اكتب ملاحظة للعميل"></textarea><label class="chk"><input type="checkbox" id="req" checked> إلزامية، لا يتخطاها العميل</label><button class="btn primary block" data-act="note" data-id="'+c.id+'">إرسال الملاحظة</button>'+
 '<h2>الاختبارات</h2>'+(c.tests.map(function(t,i){return '<div class="panel"><b>'+o(t.o).t+'</b>'+(t.st==='done'?'<p style="margin:4px 0 0">'+esc(t.res)+'</p>':'<p style="margin:4px 0 8px">'+t.when+' · بانتظار نتيجتك</p><button class="btn primary sm" data-act="res" data-id="'+c.id+'" data-i="'+i+'">اكتب النتيجة</button>')+'</div>'}).join('')||'<p class="desc">لا اختبارات.</p>'))}

function resSheet(cid,i){var c=cl(cid),t=c.tests[i];sheet('<span class="tag">'+c.n+'</span><h2 style="margin:8px 0 2px">'+o(t.o).t+'</h2><p class="desc">اكتب النتيجة بصيغة يفهمها العميل.</p><label class="lbl" for="rr">النتيجة</label><textarea id="rr"></textarea><label class="lbl" for="rt">توصية (اختياري)</label><textarea id="rt"></textarea><button class="btn primary block" data-act="sendres" data-id="'+cid+'" data-i="'+i+'">إرسال النتيجة للعميل</button>')}

function pickHtml(){
 var r=S.rg,h='<label class="lbl">الفئة</label>'+chips(Object.keys(CATS).map(function(k){return [k,CATS[k]]}),r.cat,'rcat');
 if(r.cat==='coach') h+='<label class="lbl">النوع</label>'+chips(coachTypes().map(function(t){return [t,t]}),r.type,'rtype');
 if(r.cat&&(r.cat!=='coach'||r.type)){
  var l=OF.filter(function(x){return x.cat===r.cat&&(r.cat!=='coach'||x.st===r.type)}).sort(function(a,b){return a.t.localeCompare(b.t,'ar')});
  h+='<label class="lbl">العرض (مرتب بالحروف)</label>'+(l.length?'<div class="plist">'+l.map(function(x){return '<button class="po'+(r.o===x.id?' on':'')+'" data-act="rpick" data-id="'+x.id+'"><span>'+esc(x.t)+'</span><small>'+(x.g?(x.bot?'قروب مرتبط بالبوت ✓':'قروب غير مرتبط ⚠️'):'بدون قروب')+' · '+esc(x.p)+'</small></button>'}).join('')+'</div>':'<p class="desc">لا توجد عروض في هذا التصنيف.</p>');
 }
 return h;
}
function refreshPick(){var p=$('#pick');if(p)p.innerHTML=pickHtml();hint()}
function hint(){
 var h=$('#hint');if(!h)return;var x=S.rg.o?o(S.rg.o):null;
 if(!x)h.textContent='اختر الفئة ثم العرض.';
 else if(!x.g)h.textContent='هذا العرض بدون قروب، يكفي تسجيل بيانات العميل.';
 else if(x.bot)h.textContent='هذا العرض فيه قروب ومرتبط بالبوت ✓. بعد التأكيد يوصل رابط الدخول للعميل مباشرة.';
 else h.textContent='⚠️ قروب هذا العرض غير مرتبط بالبوت. تقدر تسجل العميل، لكن ما راح ينرسل له رابط إلا بعد ما تربطه من صفحة العملاء.';
}
function regSheet(cid){
 var c=cid?cl(cid):null;S.rg={cat:'',type:'',o:''};
 sheet('<h2 style="margin:4px 0 8px">تسجيل اشتراك جديد</h2><label class="lbl" for="rn">اسم العميل</label><input class="in" id="rn" placeholder="مثال: نورة علي" value="'+(c?esc(c.n):'')+'"><label class="lbl" for="ru">يوزر تيليجرام</label><input class="in" id="ru" placeholder="@username" dir="ltr" value="'+(c?esc(c.u||''):'')+'"><div id="adminBotCheck" style="font-size:12px;margin:-2px 0 8px"></div><div id="pick"></div><p class="desc" id="hint" style="margin-top:6px"></p><button class="btn primary block" data-act="confirmreg">تأكيد وتسجيل الاشتراك</button>');
 refreshPick();checkAdminBotUser($('#ru').value);
}
function confirmReg(){
 var n=$('#rn').value.trim(),u=$('#ru').value.trim(),x=S.rg.o?o(S.rg.o):null;
 if(!n||!u){toast('اكتب اسم العميل ويوزره');return}
 if(!x){toast('اختر العرض أولاً');return}
 u=u[0]==='@'?u:'@'+u;
 var ok=window.MiniAppDB?window.MiniAppDB.isBotRegistered(u):false,st='none',ttl='تم تسجيل العميل',ic='✅',N='<b>'+esc(n)+'</b>',T='«'+esc(x.t)+'»',msg;
 if(!x.g)msg='تم تسجيل العميل '+N+' ('+esc(u)+') في '+T+' بالبيانات المدخلة.';
 else if(!x.bot){st='pending';ic='⚠️';ttl='تم التسجيل بدون إرسال رابط';msg='تم تسجيل العميل '+N+' في '+T+'، لكن قروب هذا العرض غير مرتبط بالبوت فما انرسل له رابط. اربط البوت بالقروب من صفحة «العملاء»، وبعدها يُرسل الرابط.'}
 else if(!ok){st='failed';ic='⚠️';ttl='تم التسجيل وتعذّر إرسال الرابط';msg='تم تسجيل العميل '+N+' في '+T+'، لكن اليوزر ما بدأ البوت فتعذّر إرسال الرابط. لازم يسوي «ستارت» للبوت أولاً.'}
 else{st='sent';msg='تم تسجيل العميل '+N+' في '+T+' وسينرسل له رابط الدخول للقروب من البوت. تحقق من حالته في صفحة «العملاء».'}
 var c=cByU(u);if(!c){c={id:100+CL.length,n:n,u:u,f:'🌍',since:'الآن',subs:[],notes:[],tests:[]};CL.push(c)}
 if(!c.subs.some(function(y){return y.o===x.id}))c.subs.push({o:x.id,l:'بدأ الاشتراك',p:0});
 LOG.push({o:x.id,f:c.f,m:2,rn:false});
 var rec={id:Date.now(),n:n,u:u,o:x.id,d:'الآن',prog:0,l:'بدأ الاشتراك',st:st};
 if(window.MiniAppDB){var db=window.MiniAppDB.load();db.subs=db.subs||[];db.subs.unshift(rec);window.MiniAppDB.save(db)}else LOCALSUBS.unshift(rec);
 render();
 sheet('<div style="text-align:center;padding:6px 0"><div style="font-size:34px">'+ic+'</div><h2 style="margin:6px 0">'+ttl+'</h2><p class="desc">'+msg+'</p></div><button class="btn primary block" data-act="ofp" data-id="'+x.id+'">عرض في العملاء</button><div style="margin-top:8px"><button class="btn block" data-act="addsub">تسجيل اشتراك آخر</button></div>');
}
function addOfSheet(){
 sheet('<h2 style="margin:4px 0 8px">إضافة عرض جديد</h2><label class="lbl" for="an">اسم العرض</label><input class="in" id="an"><label class="lbl" for="ac">الفئة</label><select class="in" id="ac">'+Object.keys(CATS).map(function(k){return '<option value="'+k+'">'+CATS[k]+'</option>'}).join('')+'</select><div id="adyn"></div><label class="lbl" for="ap">السعر</label><input class="in" id="ap" value="00$"><label class="lbl" for="ad">الوصف</label><textarea id="ad"></textarea><button class="btn primary block" data-act="saveadd">إضافة العرض</button>');
 addDyn();
}
function addDyn(){
 var ac=$('#ac').value,at=($('#at')||{}).value||'فردي',sm=($('#asm')||{}).value||'limited',cn=($('#acn')||{}).value||'',h='';
 var N=function(t){return '<div class="note done"><p style="margin:0">'+t+'</p></div>'};
 if(ac==='coach'){
  h='<label class="lbl" for="at">نوع الكوتشينغ</label><select class="in" id="at"><option'+(at==='فردي'?' selected':'')+'>فردي</option><option'+(at==='جماعي'?' selected':'')+'>جماعي</option></select>';
  if(at==='فردي')h+=N('كوتشينغ فردي: مقعد واحد تلقائياً وبدون قروب.');
  else h+='<label class="lbl" for="asm">المقاعد</label><select class="in" id="asm"><option value="limited"'+(sm==='limited'?' selected':'')+'>عدد محدود</option><option value="open"'+(sm==='open'?' selected':'')+'>غير محدودة</option></select>'+(sm==='limited'?'<label class="lbl" for="acn">عدد المقاعد</label><input class="in" id="acn" type="number" min="1" inputmode="numeric" value="'+esc(cn)+'">':'')+N('كوتشينغ جماعي: له قروب، وتربطه بالبوت من صفحة العملاء.');
 } else if(ac==='course')h=N('كورس تعليمي: له قروب وبدون حد للمقاعد، وتربطه بالبوت من صفحة العملاء.');
 else h=N((ac==='session'?'جلسة نفسية':'اختبار تقييم')+': فردي وبدون قروب.');
 $('#adyn').innerHTML=h;
}
function coPSheet(i){
 var c=COORD[i],p=PERMS[c[2].replace('@','')];
 sheet('<h2 style="margin:4px 0 2px">'+c[0]+' '+c[1]+'</h2><small class="lbl">'+c[2]+'</small><h2>صلاحيات المنسقة</h2><div class="panel">'+PK.map(function(k){return '<div class="row" style="margin:8px 0"><span style="font-size:14px">'+k[1]+'</span>'+sw(!!p[k[0]],'cperm',i+':'+k[0])+'</div>'}).join('')+'<p style="font-size:12px;color:var(--muted);margin:8px 0 0">تسجيل الاشتراكات وإرسال الروابط متاحة لكل المنسقات دائماً.</p></div><button class="btn block" data-act="close">تم</button>');
}

function ofSheet(id){var x=id==='new'?{id:'new',cat:'coach',t:'',p:'00$',d:''}:o(id);sheet('<h2 style="margin:4px 0 8px">'+(id==='new'?'عرض جديد':'تعديل العرض')+'</h2><label class="lbl" for="ot">الاسم</label><input class="in" id="ot" value="'+esc(x.t)+'"><label class="lbl" for="oc">الفئة</label><select class="in" id="oc">'+Object.keys(CATS).map(function(k){return '<option value="'+k+'"'+(k===x.cat?' selected':'')+'>'+CATS[k]+'</option>'}).join('')+'</select><label class="lbl" for="op">السعر</label><input class="in" id="op" value="'+esc(x.p)+'"><label class="lbl" for="od">الوصف</label><textarea id="od">'+esc(x.d)+'</textarea><button class="btn primary block" data-act="saveof" data-id="'+id+'">حفظ</button>')}

function act(el){
 var a=el.dataset.act,id=el.dataset.id,v=function(s){return $(s).value.trim()};
 if(a==='go'){closeSheet();S.tab=id;render();scrollTo(0,0)}
 else if(a==='cat'){S.cat=id;if(id!=='coach')S.coachType='all';render()}
 else if(a==='coachType'){S.coachType=id;render()}
 else if(a==='ccat'){S.ccat=id;if(id!=='coach')S.ctype='all';render()}
 else if(a==='ctype'){S.ctype=id;render()}
 else if(a==='ofp')ofpSheet(id);
 else if(a==='confirmreg')confirmReg();
 else if(a==='rcat'){S.rg={cat:id,type:'',o:''};refreshPick()}
 else if(a==='rtype'){S.rg.type=id;S.rg.o='';refreshPick()}
 else if(a==='rpick'){S.rg.o=id;refreshPick()}
 else if(a==='coP')coPSheet(+id);
 else if(a==='cperm'){var pp=id.split(':');var k=COORD[+pp[0]][2].replace('@','');PERMS[k][pp[1]]=!PERMS[k][pp[1]];syncDB();coPSheet(+pp[0]);render()}
 else if(a==='del'){var dx=o(id);sheet('<h2 style="margin:4px 0 8px">حذف العرض؟</h2><p class="desc">سيُحذف «'+esc(dx.t)+'» ولن يظهر للعملاء. هذا الإجراء لا يمكن التراجع عنه.</p><button class="btn primary block" data-act="rmof" data-id="'+id+'">نعم، احذف العرض</button><div style="margin-top:8px"><button class="btn block" data-act="close">إلغاء</button></div>')}
 else if(a==='rmof'){OF=OF.filter(function(x){return x.id!==id});if(window.MiniAppDB){var dd=window.MiniAppDB.load();dd.offers=(dd.offers||[]).filter(function(x){return x.id!==id});window.MiniAppDB.save(dd)}closeSheet();toast('تم حذف العرض');render()}
 else if(a==='saveadd'){
   var an=v('#an'),ac=$('#ac').value,ap=v('#ap');
   if(!an){toast('اكتب اسم العرض');return}
   if(!ap){toast('اكتب السعر');return}
   var at=ac==='coach'?$('#at').value:'',g=(ac==='course'||(ac==='coach'&&at==='جماعي')),seats='',mx=null,m='';
   if(ac==='coach'&&at==='فردي'){seats='مقعد فردي خاص (كرسي واحد)';mx=1;m='جلسات فردية'}
   else if(ac==='coach'){m='جلسات جماعية';if($('#asm').value==='limited'){var cc=parseInt($('#acn').value,10);if(!(cc>0)){toast('اكتب عدد المقاعد');return}mx=cc;seats='كراسي محددة ('+cc+' مقعد فقط)'}else seats='مقاعد مفتوحة (غير محدودة)'}
   else if(ac==='course'){seats='مقاعد مفتوحة (بدون حد)';m='كورس تعليمي'}
   else m=ac==='session'?'جلسات فردية':'اختبار تقييمي';
   OF.push({id:'n'+Date.now(),cat:ac,t:an,p:ap,d:v('#ad'),vis:true,feat:false,g:g,bot:false,groupName:g?('قروب '+an):'',st:at,seats:seats,maxSeats:mx,m:m});
   syncDB();closeSheet();toast(g?'تمت إضافة العرض. اربط القروب بالبوت من صفحة العملاء':'تمت إضافة العرض');render();
 }
 else if(a==='sub'){S.sub=id;render()}
 else if(a==='close')closeSheet();
 else if(a==='cl')clSheet(id);
 else if(a==='res')resSheet(id,+el.dataset.i);
 else if(a==='sendres'){
   if(!v('#rr')){toast('اكتب النتيجة أولاً');return}
   var t=cl(id).tests[+el.dataset.i];t.st='done';TD[2]++;
   t.res=v('#rr')+($('#rt').value.trim()?' — توصية: '+v('#rt'):'');
   closeSheet();
   toast('تم الإرسال بنجاح ✓');
   render();
 }
 else if(a==='nudge')toast('تم إرسال تذكير للعميل على تيليجرام');
 else if(a==='addsub')regSheet(id);
 else if(a==='note'){if(!v('#nt')){toast('اكتب الملاحظة أولاً');return}var c=cl(id);c.notes.unshift({t:v('#nt'),ack:false,d:'الآن'});toast('أُرسلت الملاحظة للعميل');clSheet(id);render()}
 else if(a==='of'){if(id==='new')addOfSheet();else ofSheet(id)}
 else if(a==='ofDetails')ofDetailsSheet(id);
 else if(a==='toggleBotGroup'){
   var x = o(id);
   x.bot = !x.bot;
   syncDB();
   toast(x.bot ? 'تم ربط البوت بالقروب كأدمن بنجاح ✓' : 'تم فصل ربط البوت من القروب');
   ofpSheet(id);
   render();
 }
 else if(a==='saveof'){if(!v('#ot')){toast('اكتب اسم العرض');return}if(id==='new'){OF.push({id:'n'+OF.length,cat:$('#oc').value,t:v('#ot'),p:v('#op'),d:v('#od'),vis:true,feat:false,g:false,bot:false})}else{var x=o(id);x.t=v('#ot');x.cat=$('#oc').value;x.p=v('#op');x.d=v('#od')}syncDB();closeSheet();toast('تم الحفظ');render()}
 else if(a==='vis'){var x=o(id);x.vis=!x.vis;syncDB();render()}
 else if(a==='feat'){var x=o(id);x.feat=!x.feat;syncDB();render()}
 else if(a==='ok'||a==='hide'){
   if(a==='ok'){
     var rv=PEND.filter(function(r){return r.id==id})[0];
     if(rv){
       var q=RT[rv.o]||[0,0];
       RT[rv.o]=[(q[0]*q[1]+rv.s)/(q[1]+1),q[1]+1];
       if(window.MiniAppDB){
         var db = window.MiniAppDB.load();
         db.reviews = db.reviews || {};
         db.reviews[rv.o] = db.reviews[rv.o] || [];
         db.reviews[rv.o].unshift({ id: rv.id, n: rv.c, u: rv.u, s: rv.s, t: rv.t });
         window.MiniAppDB.save(db);
       }
     }
   }
   PEND=PEND.filter(function(r){return r.id!=id});
   syncDB();
   toast(a==='ok'?'تم نشر التقييم وسيظهر في ميني آب':'تم إخفاء التقييم');
   render();
 }
 else if(a==='rp'){S.rp=id;render()}
 else if(a==='srt'){S.sort=id;render()}
 else if(a==='mo'){S.mo=+id;render()}
 else if(a==='rf'){S.ft=S.fc=S.fs='all';render()}
 else if(a==='read'){PRIV[+id].read=true;syncDB();render()}
 else if(a==='co'){COORD[+id][3]=!COORD[+id][3];render()}
 else if(a==='savetp'){
   TPL.forEach(function(t,i){ var el=$('#tp'+i); if(el) t[1]=el.value.trim(); });
   syncDB();
   toast('تم حفظ رسائل البوت بنجاح');
 }
 else if(a==='theme')setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
}
function setTheme(m){document.documentElement.dataset.theme=m;$('#thl').textContent=m==='light'?'فاتح':'دارك';try{localStorage.setItem('theme',m)}catch(e){}}
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&el.tagName!=='A')act(el);else if(e.target.id==='ov')closeSheet()});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;$('#cl').innerHTML=clist()}
  if(e.target.id==='oq'){S.oq=e.target.value;$('#ol').innerHTML=olist()}
  if(e.target.id==='ru'){checkAdminBotUser(e.target.value)}
});
document.addEventListener('change',function(e){
  if(['ac','at','asm'].indexOf(e.target.id)>-1&&$('#adyn'))addDyn();
  var f=e.target.dataset&&e.target.dataset.f;if(f){S[f]=e.target.value;render()}
  if(e.target.id==='sc'){
    var chosenCl = cl(e.target.value);
    if(chosenCl && $('#su')){ $('#su').value = chosenCl.u || ''; checkAdminBotUser($('#su').value); }
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.dataset&&['cl','ofp','coP'].indexOf(e.target.dataset.act)>-1)act(e.target)});
var saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
render();
</script>
